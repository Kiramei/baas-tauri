# .github/workflows/release-act.yml
# Local-only release validation for act.
# This workflow does not publish GitHub Releases and does not upload anything remotely.

name: Local Act Release Validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rust target to build locally"
        required: false
        default: "x86_64-unknown-linux-gnu"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: "--max_old_space_size=4096"
  DIST_DIR: dist-act

jobs:
  local-linux-release:
    name: Local Linux Release Build
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve build variables
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            TARGET="x86_64-unknown-linux-gnu"
          fi

          VERSION="$(jq -r .version package.json)"
          TAG_NAME="v${VERSION}"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

          echo "Target  : $TARGET"
          echo "Version : $VERSION"
          echo "Tag     : $TAG_NAME"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            curl \
            wget \
            file \
            pkg-config \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ env.TARGET }}

      - name: Verify Rust target
        shell: bash
        run: |
          rustup target add "$TARGET" --toolchain 1.95.0 || rustup target add "$TARGET"
          rustup target list --installed
          rustc --version
          cargo --version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install frontend dependencies
        shell: bash
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Build Tauri bundle
        shell: bash
        env:
          # If your Tauri updater requires signing even for local builds,
          # pass these through act with --secret-file .secrets.act.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          bun tauri build --target "$TARGET"

      - name: Collect local artifacts
        if: always()
        shell: bash
        run: |
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          BUNDLE_DIR="target/${TARGET}/release/bundle"

          echo "Bundle directory: $BUNDLE_DIR"

          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \
              \( \
                -name "*.deb" -o \
                -name "*.rpm" -o \
                -name "*.AppImage" -o \
                -name "*.tar.gz" -o \
                -name "*.zip" -o \
                -name "*.sig" \
              \) \
              -print \
              -exec cp -v {} "$DIST_DIR"/ \;
          else
            echo "::warning::Bundle directory does not exist: $BUNDLE_DIR"
          fi

          {
            echo "BAAS local act build"
            echo "Version: $VERSION"
            echo "Tag: $TAG_NAME"
            echo "Target: $TARGET"
            echo
            echo "Files:"
            find "$DIST_DIR" -maxdepth 1 -type f -printf "%f\n" | sort || true
          } > "$DIST_DIR/MANIFEST.txt"

          echo "Collected artifacts:"
          ls -lah "$DIST_DIR"

      - name: Upload local artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baas-tauri-local-${{ env.TARGET }}
          path: dist-act/**
          if-no-files-found: warn

  local-windows-exe:
    name: Local Windows EXE Build
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      TARGET: x86_64-pc-windows-msvc
      DIST_DIR: dist-act/windows
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve build variables
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Target  : $env:TARGET"
          Write-Host "Version : $version"
          Write-Host "Tag     : v$version"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Verify Rust target
        shell: pwsh
        run: |
          rustup target add $env:TARGET --toolchain 1.95.0
          rustup target list --installed
          rustc --version
          cargo --version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          bun tauri build --target $env:TARGET

      - name: Collect Windows EXE artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:DIST_DIR) {
            Remove-Item $env:DIST_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:DIST_DIR | Out-Null

          $bundleDir = "target\$env:TARGET\release\bundle\nsis"
          Write-Host "Bundle directory: $bundleDir"

          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -File | Where-Object {
              $_.Name -like "*setup.exe" -or
              $_.Name -like "*setup.exe.sig" -or
              $_.Name -like "*.nsis.zip"
            } | ForEach-Object {
              Copy-Item $_.FullName $env:DIST_DIR -Force
              Write-Host "Copied: $($_.Name)"
            }
          } else {
            Write-Warning "Bundle directory does not exist: $bundleDir"
          }

          $manifest = @()
          $manifest += "BAAS local Windows EXE build"
          $manifest += "Version: $env:VERSION"
          $manifest += "Tag: $env:TAG_NAME"
          $manifest += "Target: $env:TARGET"
          $manifest += ""
          $manifest += "Files:"
          if (Test-Path $env:DIST_DIR) {
            Get-ChildItem $env:DIST_DIR -File | Sort-Object Name | ForEach-Object {
              $manifest += $_.Name
            }
          }
          $manifest | Set-Content "$env:DIST_DIR\MANIFEST.txt"

          Get-ChildItem $env:DIST_DIR -Force

      - name: Upload Windows EXE artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baas-tauri-local-windows-exe
          path: dist-act/windows/**
          if-no-files-found: warn

  local-windows-fixed-webview2-exe:
    name: Local Windows Fixed WebView2 EXE Build
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      TARGET: x86_64-pc-windows-msvc
      ARCH: x64
      WEBVIEW2_VERSION: "133.0.3065.92"
      DIST_DIR: dist-act/windows-fixed-webview2
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve build variables
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Target  : $env:TARGET"
          Write-Host "Version : $version"
          Write-Host "Tag     : v$version"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Verify Rust target
        shell: pwsh
        run: |
          rustup target add $env:TARGET --toolchain 1.95.0
          rustup target list --installed
          rustc --version
          cargo --version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Download fixed WebView2 runtime
        shell: pwsh
        run: |
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$env:WEBVIEW2_VERSION.$env:ARCH.cab"
          $url = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$env:WEBVIEW2_VERSION/$cab"

          Invoke-WebRequest -Uri $url -OutFile $cab
          Expand ".\$cab" -F:* ".\src-tauri"

          Remove-Item ".\src-tauri\tauri.windows.conf.json" -Force
          Rename-Item ".\src-tauri\webview2.$env:ARCH.json" "tauri.windows.conf.json"

      - name: Build Windows fixed WebView2 NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          bun tauri build --target $env:TARGET

      - name: Rename fixed WebView2 artifacts
        shell: pwsh
        run: |
          $bundleDir = ".\target\$env:TARGET\release\bundle\nsis"

          Get-ChildItem "$bundleDir\*-setup.exe" | ForEach-Object {
            $newName = $_.Name -replace "-setup\.exe$", "_fixed_webview2-setup.exe"
            Rename-Item $_.FullName $newName
          }

          Get-ChildItem "$bundleDir\*.nsis.zip" | ForEach-Object {
            $newName = $_.Name -replace "-setup\.nsis\.zip$", "_fixed_webview2-setup.nsis.zip"
            Rename-Item $_.FullName $newName
          }

          Get-ChildItem "$bundleDir\*-setup.exe.sig" -ErrorAction SilentlyContinue | ForEach-Object {
            $newName = $_.Name -replace "-setup\.exe\.sig$", "_fixed_webview2-setup.exe.sig"
            Rename-Item $_.FullName $newName
          }

      - name: Collect fixed WebView2 EXE artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:DIST_DIR) {
            Remove-Item $env:DIST_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:DIST_DIR | Out-Null

          $bundleDir = "target\$env:TARGET\release\bundle\nsis"
          Write-Host "Bundle directory: $bundleDir"

          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -File | Where-Object {
              $_.Name -like "*fixed_webview2-setup.exe" -or
              $_.Name -like "*fixed_webview2-setup.exe.sig" -or
              $_.Name -like "*fixed_webview2-setup.nsis.zip"
            } | ForEach-Object {
              Copy-Item $_.FullName $env:DIST_DIR -Force
              Write-Host "Copied: $($_.Name)"
            }
          } else {
            Write-Warning "Bundle directory does not exist: $bundleDir"
          }

          $manifest = @()
          $manifest += "BAAS local Windows fixed WebView2 EXE build"
          $manifest += "Version: $env:VERSION"
          $manifest += "Tag: $env:TAG_NAME"
          $manifest += "Target: $env:TARGET"
          $manifest += "WebView2: $env:WEBVIEW2_VERSION"
          $manifest += ""
          $manifest += "Files:"
          if (Test-Path $env:DIST_DIR) {
            Get-ChildItem $env:DIST_DIR -File | Sort-Object Name | ForEach-Object {
              $manifest += $_.Name
            }
          }
          $manifest | Set-Content "$env:DIST_DIR\MANIFEST.txt"

          Get-ChildItem $env:DIST_DIR -Force

      - name: Upload fixed WebView2 EXE artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baas-tauri-local-windows-fixed-webview2-exe
          path: dist-act/windows-fixed-webview2/**
          if-no-files-found: warn
