name: Frontend UI compatibility

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/locales/**'
      - 'tests/frontend/**'
      - 'scripts/i18n.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/frontend-ui.yml'
  push:
    branches: [dev, 'codex/feat-upstream-ui']
    paths:
      - 'src/**'
      - 'public/locales/**'
      - 'tests/frontend/**'
      - 'scripts/i18n.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/frontend-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/generate-font-assets
      - uses: ./.github/actions/setup-bun-deps
      - name: Validate localized controls and configuration behavior
        run: |
          bun run i18n:check
          bunx tsc --noEmit
          bun run test:transport
      - name: Build all client interfaces
        run: |
          bun run build:webui
          bun run build:tauri
          bun run build:tauri:android
