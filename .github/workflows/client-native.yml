name: Client native
on:
  workflow_call:
    inputs:
      desktop:
        required: true
        type: string
      android:
        required: true
        type: string
      android-tests:
        required: true
        type: boolean
      appimage-smoke:
        description: Build and extract local Linux AppImages without signing or publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  android-tests:
    name: Android backend tests
    if: inputs.android-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.9"}
      - run: python -m pip install 'numpy<2' opencv-python-headless==4.11.0.86 Pillow tomli requests
      - run: python -m unittest discover -s scripts/tests -p 'test_android*.py'
      - name: Test Android command registration and dispatch
        run: |
          rustc --test --edition=2021 src-tauri/tests/android_native_dispatch.rs -o "$RUNNER_TEMP/dispatch"
          "$RUNNER_TEMP/dispatch"

  desktop-rust:
    name: ${{ matrix.target }} client tests
    if: ${{ inputs.desktop != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.appimage-smoke && 90 || 45 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust test environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          download-fonts: "false"
          install-frontend: ${{ inputs.appimage-smoke && runner.os == 'Linux' && 'true' || 'false' }}
          cache-variant: workspace-tests
          save-cache: "false"

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install optional AppImage tooling
        if: inputs.appimage-smoke && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends patchelf xdg-utils file binutils
          for tool in xdg-mime xdg-open patchelf file readelf glib-compile-schemas; do
            command -v "$tool"
          done

      - name: Run Rust tests
        run: cargo test --workspace --exclude baasx-runtime --exclude baas-cli-runtime --all-targets --locked --target ${{ matrix.target }}

      - name: Build and extract AppImage smoke artifact
        if: inputs.appimage-smoke && runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '<!doctype html><title>AppImage packaging smoke</title>' > dist/index.html
          bun tauri build --debug --ci --bundles appimage --target '${{ matrix.target }}' \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
          IMAGE="$(find "$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$IMAGE"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          "$IMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/baas-tauri

      - name: Upload AppImage smoke artifact
        if: inputs.appimage-smoke && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: appimage-smoke-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Test macOS release bundle verification
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/tests -p test_macos_bundles.py

  android:
    name: Android ${{ matrix.abi }} native build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ inputs.android != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.android) }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          download-fonts: "false"
          cache-variant: android-debug
          save-cache: "false"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make perl unzip
          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      # Native checks need a valid WebView asset for Tauri/Gradle packaging.
      # Release builds always embed the complete production UI.
      - name: Prepare minimal WebView asset for the native test APK
        run: |
          mkdir -p dist
          echo '<!doctype html><title>Native CI</title>' > dist/index.html

      - name: Build Android debug APK
        run: bun run tauri:android:build:debug -- --abi ${{ matrix.abi }} --skip-web-build

      - name: Run Android release lint
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:lintVital${{ matrix.gradle }}Release -x rustBuild${{ matrix.gradle }}Release
