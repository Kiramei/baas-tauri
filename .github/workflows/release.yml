# This is modified from clash-verge-rev project, thanks for their efforts.

name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check_tag_version:
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if tag is from master branch
        shell: bash
        run: |
          set -euo pipefail

          TAG_REF="${GITHUB_REF##*/}"
          echo "Checking if tag $TAG_REF is from master branch..."

          TAG_COMMIT="$(git rev-list -n 1 "$TAG_REF")"
          MASTER_COMMITS="$(git rev-list origin/master)"

          if echo "$MASTER_COMMITS" | grep -q "$TAG_COMMIT"; then
            echo "✅ Tag $TAG_REF is from master branch"
          else
            echo "❌ Tag $TAG_REF is not from master branch"
            echo "This release workflow only accepts tags from master branch."
            exit 1
          fi

      - name: Check tag and package.json version
        shell: bash
        run: |
          set -euo pipefail

          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          echo "Current tag: $TAG_REF"

          PKG_VERSION="$(jq -r .version package.json)"
          echo "package.json version: $PKG_VERSION"

          EXPECTED_TAG="v$PKG_VERSION"

          if [[ "$TAG_REF" != "$EXPECTED_TAG" ]]; then
            echo "❌ Version mismatch:"
            echo "   Git tag       : $TAG_REF"
            echo "   package.json  : $EXPECTED_TAG"
            exit 1
          fi

          echo "✅ Tag and package.json version are consistent."

  create_release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [check_tag_version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-rc') }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, reuse it."
            exit 0
          fi

          args=(
            --repo "$GH_REPO"
            --draft
            --title "BAAS Tauri App $TAG_NAME"
            --notes "Draft release, will be updated later."
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG_NAME" "${args[@]}"

  release:
    name: Release Build
    needs: [create_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dist_arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          prefix-key: "v1-rust"
          key: "rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Bun install
        shell: bash
        run: |
          bun install --frozen-lockfile

      - name: Tauri build
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}".TrimStart("v")
          $arch = "${{ matrix.dist_arch }}"
          $src = "target\${{ matrix.target }}\release\bundle\nsis"
          $dst = "release-assets"

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $exe = Get-ChildItem $src -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS setup exe found in $src"
          }
          Copy-Item $exe.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.exe" -Force

          $sig = Get-ChildItem $src -File -Filter "*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.exe.sig" -Force
          }

          $zip = Get-ChildItem $src -File -Filter "*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.nsis.zip" -Force
          }

          Get-ChildItem $dst -File | Sort-Object Name

      - name: Normalize Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          DEB="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1 || true)"
          if [ -z "$DEB" ]; then
            echo "::error::No deb package found in $SRC/deb"
            exit 1
          fi
          cp -v "$DEB" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb"

          DEB_SIG="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb.sig' | head -n 1 || true)"
          if [ -n "$DEB_SIG" ]; then
            cp -v "$DEB_SIG" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb.sig"
          fi

          RPM="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "$RPM" ]; then
            echo "::error::No rpm package found in $SRC/rpm"
            exit 1
          fi
          cp -v "$RPM" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm"

          RPM_SIG="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm.sig' | head -n 1 || true)"
          if [ -n "$RPM_SIG" ]; then
            cp -v "$RPM_SIG" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm.sig"
          fi

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Attest Windows bundles
        if: matrix.os == 'windows-latest'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Attest Linux bundles
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload normalized release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: release-assets/*

  release-for-fixed-webview2:
    name: Release Build for Fixed WebView2
    needs: [create_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          prefix-key: "v1-rust"
          key: "rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Bun install
        shell: bash
        run: |
          bun install --frozen-lockfile

      - name: Download WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "133.0.3065.92"
          $arch = "${{ matrix.arch }}"
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.$arch.cab"
          $url = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab"

          Invoke-WebRequest -Uri $url -OutFile $cab
          expand.exe ".\$cab" -F:* ".\src-tauri"

          Remove-Item ".\src-tauri\tauri.windows.conf.json" -Force
          Rename-Item ".\src-tauri\webview2.$arch.json" "tauri.windows.conf.json"

      - name: Tauri build
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize fixed WebView2 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}".TrimStart("v")
          $arch = "${{ matrix.arch }}"
          $src = "target\${{ matrix.target }}\release\bundle\nsis"
          $dst = "release-assets"

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $exe = Get-ChildItem $src -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS setup exe found in $src"
          }
          Copy-Item $exe.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.exe" -Force

          $sig = Get-ChildItem $src -File -Filter "*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.exe.sig" -Force
          }

          $zip = Get-ChildItem $src -File -Filter "*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.nsis.zip" -Force
          }

          Get-ChildItem $dst -File | Sort-Object Name

      - name: Attest Windows bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload fixed WebView2 release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: release-assets/*

      - name: Portable Bundle
        run: bun run portable-fixed-webview2 ${{ matrix.target }}

      - name: Upload fixed WebView2 portable bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: BAAS.Tauri_*_${{ matrix.arch }}_fixed_webview2_portable.zip

  update_tag:
    name: Update tag
    runs-on: ubuntu-latest
    needs: [release, release-for-fixed-webview2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/genUpdateLog.sh
        shell: bash

      - name: Set Env
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> "$GITHUB_ENV"
          TAG_REF="${GITHUB_REF##*/}"
          echo "TAG_NAME=$TAG_REF" >> "$GITHUB_ENV"
          VERSION="${TAG_REF#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG_REF" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          if [ -z "${UPDATE_LOGS:-}" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          ## Download

          ### Windows
          - [Windows x64 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64-setup.exe)
          - [Windows x64 fixed WebView2 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_fixed_webview2-setup.exe)
          - [Windows x64 fixed WebView2 portable](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_fixed_webview2_portable.zip)

          ### Linux
          - [Linux amd64 DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_amd64.deb)
          - [Linux x86_64 RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x86_64.rpm)

          ### Download Acceleration Service
          - [MirrorChyan](https://mirrorchyan.com/)

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-rc') }}
        shell: bash
        run: |
          set -euo pipefail

          matches="$(gh api repos/{owner}/{repo}/releases --paginate --jq '.[] | select(.tag_name == env.TAG_NAME) | [.id, .draft, (.assets | length), .html_url] | @tsv')"
          release_count="$(grep -c . <<< "$matches" || true)"

          if [ "$release_count" -eq 0 ]; then
            echo "::error::No release found for $TAG_NAME."
            exit 1
          fi

          if [ "$release_count" -gt 1 ]; then
            printf '%s\n' "$matches"
            echo "::error::Multiple releases found for $TAG_NAME. Merge or delete duplicate releases before rerunning."
            exit 1
          fi

          IFS=$'\t' read -r release_id _ asset_count release_url <<< "$matches"
          echo "Publishing release $release_id ($release_url) with $asset_count assets."

          gh api --method PATCH repos/{owner}/{repo}/releases/"$release_id" \
            -f name="BAAS Tauri App $TAG_NAME" \
            -F body=@release.txt \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            --silent

  release-update:
    if: ${{ !contains(github.ref_name, '-rc') }}
    name: Release Update
    runs-on: ubuntu-latest
    needs: [update_tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Bun install
        run: bun install --frozen-lockfile

      - name: Release updater file
        run: bun run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-update-for-fixed-webview2:
    if: ${{ !contains(github.ref_name, '-rc') }}
    name: Release Update for Fixed WebView2
    runs-on: ubuntu-latest
    needs: [update_tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Bun install
        run: bun install --frozen-lockfile

      - name: Release updater file
        run: bun run updater-fixed-webview2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
