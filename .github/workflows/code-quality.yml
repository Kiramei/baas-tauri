name: Code Quality

on:
  pull_request:
    branches: [dev, main]
    paths: &client-paths
      - "src/**"
      - "public/**"
      - "tests/frontend/**"
      - "scripts/**"
      - "src-tauri/**"
      - "crates/**"
      - ".cargo/**"
      - "Cargo.*"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "eslint.config.*"
      - ".github/actions/**"
      - ".github/workflows/code-quality.yml"
  push:
    branches: [dev, main]
    paths: *client-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Identify native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check native build inputs
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_paths="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -Eq '^(src-tauri/|crates/|\.cargo/|Cargo\.|scripts/(android|prepare-android|tests/test_android)|\.github/(actions/|workflows/code-quality\.yml))' <<< "$changed_paths"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  generate-fonts:
    name: Generate font assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: generate-fonts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download generated font assets
        uses: ./.github/actions/download-font-assets

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Setup Android runtime Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Validate client source and translations
        run: |
          bunx eslint src tests/frontend --ext .ts,.tsx
          bun run i18n:check

      - name: Test client behavior and authenticated transport
        run: bun run test:transport

      - name: Test Android bootstrap preservation
        run: bun run test:android-bootstrap

      - name: Verify Android private worker protocol and redaction
        run: python scripts/tests/test_android_plugin_worker.py

      - name: Build WebUI frontend
        run: bun run build:webui

      - name: Build desktop frontend
        run: bun run build:tauri

      - name: Build Android frontend
        run: bun run build:tauri:android

  desktop-rust:
    name: ${{ matrix.name }} Rust tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust test environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          download-fonts: "false"
          install-frontend: "false"
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Linux Tauri dependencies
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --locked

  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [changes, generate-fonts]
    if: needs.changes.outputs.native == 'true'
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: aarch64-linux-android
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make perl unzip
          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Build Android debug APK
        run: bun run tauri:android:build:debug -- --abi arm64

      - name: Run Android release lint
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:lintVitalArm64Release -x rustBuildArm64Release
