name: Code Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-fonts:
    name: Generate font assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: generate-fonts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download generated font assets
        uses: ./.github/actions/download-font-assets

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Lint frontend
        run: bun run lint

      - name: Test transport handshake
        run: bun run test:transport

      - name: Test C++ service packaging contract
        run: bun run test:cpp-service-package

      - name: Test Android bootstrap preservation
        run: bun run test:android-bootstrap

      - name: Build desktop frontend
        run: bun run build:tauri

      - name: Build Android frontend
        run: bun run build:tauri:android

  desktop-rust:
    name: ${{ matrix.name }} Rust tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust test environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          download-fonts: "false"
          install-frontend: "false"
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Linux Tauri dependencies
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --locked

  cpp-service-integration:
    name: ${{ matrix.name }} real C++ service integration
    if: ${{ vars.BAAS_CPP_DEV_RUNTIME_REPOSITORY_REF != '' && vars.BAAS_RUNTIME_REPOSITORY_TRUSTED_PUBLIC_KEY_HEX != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS native
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve native Rust target
        id: native-target
        shell: bash
        run: |
          echo "target=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      - name: Setup native test environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ steps.native-target.outputs.target }}
          download-fonts: "false"
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build and smoke pinned C++ service
        uses: ./.github/actions/build-cpp-service
        with:
          target: ${{ steps.native-target.outputs.target }}
          source-ref: ${{ vars.BAAS_CPP_DEV_RUNTIME_REPOSITORY_REF }}
          runtime-repository-trusted-public-key-hex: ${{ vars.BAAS_RUNTIME_REPOSITORY_TRUSTED_PUBLIC_KEY_HEX }}

      - name: Test authenticated integration, packaging, and managed lifecycle
        run: |
          bun run e2e:cpp-service
          bun run test:cpp-service-package
          cargo test -p baas-tauri --lib commands::tests::real_cpp_service_ --locked

  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: generate-fonts
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: aarch64-linux-android
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make perl unzip
          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Build Android debug APK
        run: bun run tauri:android:build:debug -- --abi arm64
