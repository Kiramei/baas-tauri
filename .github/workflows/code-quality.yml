name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [baasx-dev]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify release contracts, the selected commit, or all modules
        type: choice
        options: [contracts, changes, full, baasx-package]
        default: contracts
      target:
        description: BAASX distribution (baasx-package mode only)
        type: choice
        options: [all, linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64]
        default: all

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine verification inputs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      plan: ${{ steps.paths.outputs.plan }}
      frontend: ${{ steps.paths.outputs.frontend }}
      bundles: ${{ steps.paths.outputs.bundles }}
      adapters: ${{ steps.paths.outputs.adapters }}
      native: ${{ steps.paths.outputs.client-native }}
      baasx: ${{ steps.paths.outputs.baasx }}
      docs: ${{ steps.paths.outputs.docs }}
      contracts: ${{ steps.paths.outputs.contracts }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          # PR merge parent + head are sufficient. New branch pushes need their merge base.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          persist-credentials: false
      - id: paths
        run: python3 scripts/ci/impact.py plan

  contracts:
    name: CI and release contracts
    if: needs.changes.outputs.contracts == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.14"}
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_mirror_upstream_release.py'
      - run: bun test tests/frontend/CiPolicy.test.ts tests/frontend/ReleaseWorkflows.test.ts tests/frontend/ReleasePublishing.test.ts
      - name: Lint workflow expressions and job dependencies
        shell: bash
        run: |
          base=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl --fail --silent --show-error --location "$base/actionlint_1.7.12_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tgz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          # 1.7.12 predates GitHub's queue: max syntax. The queue policy is tested separately.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -ignore '^unexpected key "queue" for "concurrency" section'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/client-frontend.yml
    with:
      modes: ${{ toJSON(fromJSON(needs.changes.outputs.plan).frontend) }}
      bundles: ${{ fromJSON(needs.changes.outputs.bundles) }}
      adapters: ${{ needs.changes.outputs.adapters }}

  client-native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/client-native.yml
    with:
      desktop: ${{ toJSON(fromJSON(needs.changes.outputs.plan).desktop) }}
      android: ${{ toJSON(fromJSON(needs.changes.outputs.plan).android) }}
      android-tests: ${{ fromJSON(needs.changes.outputs.plan).android-tests }}

  baasx:
    needs: changes
    if: needs.changes.outputs.baasx == 'true'
    uses: ./.github/workflows/baasx-checks.yml
    with:
      source: ${{ fromJSON(needs.changes.outputs.plan).baasx-source }}
      platforms: ${{ toJSON(fromJSON(needs.changes.outputs.plan).baasx-platform) }}
      registry: ${{ fromJSON(needs.changes.outputs.plan).registry }}

  baasx-package:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'baasx-package'
    uses: ./.github/workflows/baasx.yml
    with:
      target: ${{ inputs.target }}

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-validation.yml
    with:
      site: ${{ fromJSON(needs.changes.outputs.plan).site }}
      readme: ${{ fromJSON(needs.changes.outputs.plan).readme }}

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s scripts/tests -p 'test_docker*.py'

  quality-gate:
    name: Dev quality gate
    if: always()
    needs: [changes, contracts, frontend, client-native, baasx, baasx-package, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Require the exact planned conclusions
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/impact.py gate

  documentation-gate:
    name: Dev documentation gate
    if: always()
    needs: [changes, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Require the exact planned conclusions
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/impact.py gate --docs
