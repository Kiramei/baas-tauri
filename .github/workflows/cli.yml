name: BAAS CLI

on:
  push:
    branches: [cli-dev, dev, main]
    paths:
      [
        "cli/**",
        "packages/baas-client/**",
        "src/shared/SecureWebSocket.ts",
        "package.json",
        "bun.lock",
        ".github/workflows/cli.yml",
      ]
  pull_request:
    paths:
      [
        "cli/**",
        "packages/baas-client/**",
        "src/shared/SecureWebSocket.ts",
        "package.json",
        "bun.lock",
        ".github/workflows/cli.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run cli:check
      - run: bun run cli:test
      - run: bunx eslint cli/src cli/tests packages/baas-client/src packages/baas-client/tests src/shared/SecureWebSocket.ts
      - run: bun run cli:build
      - run: bun cli/bin/baas.mjs --demo --json status
      - run: bun run cli:binary
      - uses: actions/upload-artifact@v4
        with:
          name: baas-cli-${{ runner.os }}-${{ runner.arch }}
          path: |
            cli/dist/baas
            cli/dist/baas.exe
