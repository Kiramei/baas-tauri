name: Release baasx

on:
  push:
    tags:
      - "baasx-v[0-9]*.[0-9]*.[0-9]*"
  # Release reruns require an existing baasx-v* tag. Auth-only checks also allow branches.
  workflow_dispatch:
    inputs:
      auth_only:
        description: Check npm authentication only; skip builds and all publication.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-baasx-publication
  queue: max

jobs:
  npm-auth:
    name: Check npm trusted publishing before builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check package-specific npm OIDC exchanges
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node baasx/scripts/npm-auth.mjs

  validate:
    name: Validate the independent baasx release tag
    if: ${{ !inputs.auth_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the baasx package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { version } = require("./baasx/package.json");
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          const parsed = version.match(semver);
          const invalidPrerelease = parsed?.[4]?.split(".").some(id => /^0\d+$/.test(id));
          if (process.env.RELEASE_REF_TYPE !== "tag" || !parsed || invalidPrerelease ||
              process.env.RELEASE_TAG !== `baasx-v${version}`) {
            throw new Error(`Select the existing baasx-v${version} tag; baasx releases use baasx/package.json, not the desktop version.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${Boolean(parsed[4])}\n`);
          NODE
      - name: Require the baasx release branch
        run: |
          git fetch --no-tags origin baasx-dev:refs/remotes/origin/baasx-dev
          if ! git merge-base --is-ancestor HEAD origin/baasx-dev; then
            echo "::error::baasx release tags must point to commits on baasx-dev."
            exit 1
          fi

  build:
    name: Verify and build baasx on all platforms
    needs: [validate, npm-auth]
    uses: ./.github/workflows/baasx.yml
    permissions:
      contents: read

  publish:
    name: Publish the standalone baasx release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Load Chinese release notes
        env:
          BAASX_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          notes="baasx/release-notes/${BAASX_VERSION}.md"
          if [[ -f "$notes" ]]; then
            {
              echo 'QQ_RELEASE_NOTES<<QQ_RELEASE_NOTES_END'
              cat "$notes"
              echo
              echo 'QQ_RELEASE_NOTES_END'
            } >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: baasx-*
          path: release-assets
          merge-multiple: true
      - name: Verify all distributions and create checksums
        env:
          BAASX_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          native=(baasx-"$BAASX_VERSION"-*.tar.gz)
          packages=(baasx-"$BAASX_VERSION"-*.tgz)
          node --input-type=module <<'JS'
          import { platforms } from '../baasx/scripts/distribution-platforms.mjs';
          import { readdirSync, statSync } from 'node:fs';
          if (readdirSync('.').some(name => name.endsWith('.sig'))) throw new Error('BAASX assets must not include .sig files');
          for (const p of platforms) for (const ext of ['.tar.gz',p.packageExtension]) {
            if (!statSync(`baasx-${process.env.BAASX_VERSION}-${p.asset}${ext}`).size) throw new Error('Empty asset');
          }
          JS
          sha256sum "${native[@]}" "${packages[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish baasx assets without changing the desktop Latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: baasx v${{ needs.validate.outputs.version }}
          make_latest: "false"
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## QQ 更新说明
            ${{ env.QQ_RELEASE_NOTES }}

            ## Installation
            Standalone baasx automation terminal. This release is separate from the BAAS Tauri desktop client.

            - Download the native archive for your operating system and architecture and preserve all extracted directories; Bun and Rust are not required on the target machine.
            - Linux ARMv7 hard-float (`armv7l` / `armhf`) uses `Linux-ARMV7L`, with bundled Node.js and a native ARM32 Rust helper. Its `-node.tgz` package requires Node.js 20.3+. Other platforms retain their `-bun.tgz` packages.
            - ARM32 supports the terminal, remote services and scheduling. Managed local setup requires a published OCR payload and validated Python/dependencies and is unavailable on ARM32.
            - `SHA256SUMS` contains checksums for all platform distributions.
            - Builds use the pinned Bun compiler and must pass source tests, CLI checks and extracted-package smoke tests on all supported platforms, including ARM32 Rust, Node and terminal tests through QEMU, before publication. Archives have no `.sig` files.

  sync-cnb-release:
    name: Sync baasx release to CNB
    needs: [publish]
    if: github.repository == 'Kiramei/baas-tauri'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/sync-cnb-release
        with:
          github-token: ${{ github.token }}
          cnb-token: ${{ secrets.RELEASE_TO_CNB }}
          tag-name: ${{ github.ref_name }}
          cnb-repo-slug: kiramei/baas-tauri
          make-latest: "false"
          asset-contract: baasx
          wait-timeout-minutes: "0"

  publish-registry:
    name: Publish baasx to ${{ matrix.registry }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: npm
            url: https://registry.npmjs.org/
            scope: kiramei
          - registry: GitHub Packages
            url: https://npm.pkg.github.com/
            scope: kiramei
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: ${{ matrix.url }}
      - uses: actions/download-artifact@v4
        with:
          pattern: baasx-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: registry-node-bundle
          path: registry-bundle
      - name: Assemble platform packages and scoped CLI
        run: node baasx/scripts/registry-package.mjs --assets release-assets --bundle registry-bundle/baasx-node.mjs --output "$RUNNER_TEMP/baasx-registry" --scope "${{ matrix.scope }}" > "$RUNNER_TEMP/baasx-registry-info.json"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - name: Smoke test the actual split packages before publication
        env:
          BAASX_SMOKE_BUN: bun
        run: |
          node baasx/scripts/registry-smoke.mjs "$RUNNER_TEMP/baasx-registry-info.json"
          node baasx/scripts/registry-smoke.mjs "$RUNNER_TEMP/baasx-registry-info.json" --target linux-armv7l --install-only
          node baasx/scripts/registry-smoke.mjs "$RUNNER_TEMP/baasx-registry-info.json" --target linux-armhf --install-only
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ matrix.registry == 'GitHub Packages' && github.token || secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          tag=latest
          if [[ "$PRERELEASE" == true ]]; then tag=next; fi
          node baasx/scripts/registry-publish.mjs --info "$RUNNER_TEMP/baasx-registry-info.json" --registry "${{ matrix.url }}" --tag "$tag"

  notify-qq:
    name: Notify QQ after publication
    needs: [sync-cnb-release, publish-registry]
    if: ${{ always() && needs.sync-cnb-release.result == 'success' && needs.publish-registry.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/notify-qq
        with:
          webhook-secret: ${{ secrets.QQ_RELEASE_WEBHOOK_SECRET }}
          github-token: ${{ github.token }}
