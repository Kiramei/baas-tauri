# This is modified from clash-verge-rev project, thanks for their efforts.

name: Release App

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      mirror-tag:
        description: Existing source release tag to mirror or publish (no build).
        required: true
        type: string
      dry-run:
        description: Preview metadata and planned changes without publishing or transferring binaries.
        type: boolean
        default: true
      publish-existing:
        description: Publish the existing verified draft and resume distributors; requires main and dry-run false.
        type: boolean
        default: false

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  # Mirror-only backfills are independent; source recovery shares publication serialization.
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs['publish-existing'] && format('release-app-mirror-{0}', github.run_id) || 'release-app-publication' }}
  queue: max

jobs:
  check_tag_version:
    if: github.event_name == 'push'
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        uses: ./.github/actions/check-release-tag

  create_release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check_tag_version]
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '.rc') }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, reuse it."
            exit 0
          fi

          args=(
            --repo "$GH_REPO"
            --draft
            --title "BAAS Tauri App $TAG_NAME"
            --notes "Draft release, will be updated later."
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG_NAME" "${args[@]}"

  generate_fonts:
    name: Generate font assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check_tag_version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  release:
    name: Release Build
    needs: [create_release, generate_fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dist_arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            dist_arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            dist_arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            dist_arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          save-cache: "true"

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install x86 OpenSSL (macOS only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Refresh bundled release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-client-release-history.mjs

      - name: Tauri build
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          # This key signs updater archives. The macOS config signs the .app
          # ad hoc before Tauri creates the DMG, archive and updater signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}" -replace '^v', ''
          $arch = "${{ matrix.dist_arch }}"
          $src = "target\${{ matrix.target }}\release\bundle\nsis"
          $dst = "release-assets"

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $exe = Get-ChildItem $src -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS setup exe found in $src"
          }
          Copy-Item $exe.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.exe" -Force

          $releaseDir = "target\${{ matrix.target }}\release"
          $portableCandidates = @(
            "baas-tauri.exe",
            "BAAS Tauri.exe",
            "BAAS.Tauri.exe"
          )
          $portable = $null
          foreach ($candidate in $portableCandidates) {
            $candidatePath = Join-Path $releaseDir $candidate
            if (Test-Path $candidatePath) {
              $portable = Get-Item $candidatePath
              break
            }
          }
          if (-not $portable) {
            $portable = Get-ChildItem $releaseDir -File -Filter "*.exe" |
              Where-Object {
                $_.Name -notlike "*setup*" -and
                $_.Name -notlike "unins*" -and
                $_.Name -notlike "*bootstrapper*"
              } |
              Select-Object -First 1
          }
          if (-not $portable) {
            throw "No portable application exe found in $releaseDir"
          }
          Copy-Item $portable.FullName "$dst\BAAS.Tauri_${version}_${arch}_portable.exe" -Force

          $sig = Get-ChildItem $src -File -Filter "*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.exe.sig" -Force
          }

          $zip = Get-ChildItem $src -File -Filter "*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.nsis.zip" -Force
          }

          Get-ChildItem $dst -File | Sort-Object Name

      - name: Sign Windows portable executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $file = "release-assets/BAAS.Tauri_${version}_${{ matrix.dist_arch }}_portable.exe"
          bun tauri signer sign "$file"
          if ($LASTEXITCODE -ne 0) { throw "Portable executable signing failed" }
          if (-not (Test-Path "$file.sig") -or (Get-Item "$file.sig").Length -eq 0) {
            throw "Portable executable signature is missing"
          }

      - name: Normalize macOS artifacts
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.dist_arch }}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          FOUND=0

          DMG="$(find "$SRC/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1 || true)"
          if [ -n "$DMG" ]; then
            cp -v "$DMG" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.dmg"
            FOUND=1
          fi

          DMG_SIG="$(find "$SRC/dmg" -maxdepth 1 -type f -name '*.dmg.sig' | head -n 1 || true)"
          if [ -n "$DMG_SIG" ]; then
            cp -v "$DMG_SIG" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.dmg.sig"
          fi

          APP_TAR="$(find "$SRC/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1 || true)"
          if [ -n "$APP_TAR" ]; then
            cp -v "$APP_TAR" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.app.tar.gz"
            FOUND=1
          fi

          APP_TAR_SIG="$(find "$SRC/macos" -maxdepth 1 -type f -name '*.app.tar.gz.sig' | head -n 1 || true)"
          if [ -n "$APP_TAR_SIG" ]; then
            cp -v "$APP_TAR_SIG" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No macOS bundle found in $SRC/dmg or $SRC/macos"
            exit 1
          fi

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Verify macOS release bundles
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          python3 scripts/verify-macos-bundles.py \
            --target "${{ matrix.target }}" \
            --bundle-dir "target/${{ matrix.target }}/release/bundle" \
            --assets-dir release-assets \
            --version "${GITHUB_REF_NAME#v}"

      - name: Normalize Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          DEB="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1 || true)"
          if [ -z "$DEB" ]; then
            echo "::error::No deb package found in $SRC/deb"
            exit 1
          fi
          cp -v "$DEB" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb"

          cp -v "$DEB.sig" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb.sig"

          RPM="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "$RPM" ]; then
            echo "::error::No rpm package found in $SRC/rpm"
            exit 1
          fi
          cp -v "$RPM" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm"

          cp -v "$RPM.sig" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm.sig"

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Attest release bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload normalized release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          overwrite_files: true
          files: release-assets/*

  release-for-linux-arm:
    name: Release Build for Linux ARM
    needs: [create_release, generate_fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            multiarch_triplet: aarch64-linux-gnu
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            arch: armhf
            deb_arch: armhf
            rpm_arch: armv7hl
            multiarch_triplet: arm-linux-gnueabihf
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          save-cache: "true"

      - uses: ./.github/actions/setup-linux-arm
        with:
          arch: ${{ matrix.arch }}
          triplet: ${{ matrix.multiarch_triplet }}
          target: ${{ matrix.target }}

      - name: Refresh bundled release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-client-release-history.mjs

      - name: Tauri build
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize Linux ARM artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          DEB="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1 || true)"
          if [ -z "$DEB" ]; then
            echo "::error::No deb package found in $SRC/deb"
            exit 1
          fi
          cp -v "$DEB" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb"

          cp -v "$DEB.sig" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb.sig"

          RPM="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "$RPM" ]; then
            echo "::error::No rpm package found in $SRC/rpm"
            exit 1
          fi
          cp -v "$RPM" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm"

          cp -v "$RPM.sig" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm.sig"

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Attest Linux bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload normalized release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          overwrite_files: true
          files: release-assets/*

  release-android:
    name: Release Build for Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: [create_release, generate_fonts]
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: aarch64-linux-android
          save-cache: "true"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make perl unzip

          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to build a signed Android release APK."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/baas-android-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Refresh bundled release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-client-release-history.mjs

      - name: Build Android arm64 release APK
        shell: bash
        run: bun run tauri:android:build:release -- --abi arm64

      - name: Prepare signed Android updater assets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
          DST="release-assets"

          if [ ! -f "$SRC" ]; then
            echo "::error::No Android release APK found at $SRC"
            exit 1
          fi

          rm -rf "$DST"
          mkdir -p "$DST"
          APK="$DST/BAAS.Tauri_${VERSION}_android_arm64-v8a.apk"
          cp -v "$SRC" "$APK"
          bun tauri signer sign "$APK"
          test -s "$APK.sig"
          ls -lah "$DST"

      - name: Attest Android APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload Android release APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          overwrite_files: true
          files: release-assets/*

  release-for-fixed-webview2:
    name: Release Build for Fixed WebView2
    needs: [create_release, generate_fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          cache-variant: fixed-webview2
          save-cache: "true"

      - name: Download WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "133.0.3065.92"
          $arch = "${{ matrix.arch }}"
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.$arch.cab"
          $url = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab"

          Invoke-WebRequest -Uri $url -OutFile $cab
          expand.exe ".\$cab" -F:* ".\src-tauri"

          Remove-Item ".\src-tauri\tauri.windows.conf.json" -Force
          Rename-Item ".\src-tauri\webview2.$arch.json" "tauri.windows.conf.json"

      - name: Refresh bundled release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-client-release-history.mjs

      - name: Tauri build
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize fixed WebView2 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}" -replace '^v', ''
          $arch = "${{ matrix.arch }}"
          $src = "target\${{ matrix.target }}\release\bundle\nsis"
          $dst = "release-assets"

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $exe = Get-ChildItem $src -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS setup exe found in $src"
          }
          Copy-Item $exe.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.exe" -Force

          $sig = Get-ChildItem $src -File -Filter "*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.exe.sig" -Force
          }

          $zip = Get-ChildItem $src -File -Filter "*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.nsis.zip" -Force
          }

          Get-ChildItem $dst -File | Sort-Object Name

      - name: Attest Windows bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload fixed WebView2 release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          overwrite_files: true
          files: release-assets/*

      - name: Portable Bundle
        run: bun run portable-fixed-webview2 ${{ matrix.target }}

      - name: Sign fixed WebView2 portable bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $file = "BAAS.Tauri_${version}_${{ matrix.arch }}_fixed_webview2_portable.zip"
          bun tauri signer sign "$file"
          if ($LASTEXITCODE -ne 0) { throw "Portable bundle signing failed" }
          if (-not (Test-Path "$file.sig") -or (Get-Item "$file.sig").Length -eq 0) {
            throw "Portable bundle signature is missing"
          }

      - name: Upload fixed WebView2 portable bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          overwrite_files: true
          files: |
            BAAS.Tauri_*_${{ matrix.arch }}_fixed_webview2_portable.zip
            BAAS.Tauri_*_${{ matrix.arch }}_fixed_webview2_portable.zip.sig

  update_tag:
    if: ${{ always() && !cancelled() && ((github.event_name == 'push' && needs.release.result == 'success' && needs.release-for-linux-arm.result == 'success' && needs.release-android.result == 'success' && needs.release-for-fixed-webview2.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs['publish-existing'] && !inputs['dry-run'] && github.ref == 'refs/heads/main')) }}
    name: Update tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release, release-for-linux-arm, release-android, release-for-fixed-webview2]
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for release publication
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve verified publication source
        id: source
        shell: bash
        env:
          INPUT_TAG: ${{ inputs['mirror-tag'] }}
          PUBLISH_EXISTING: ${{ inputs['publish-existing'] }}
          DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          set -euo pipefail
          node --version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { parseAppReleaseTag } from './scripts/release-publication.mjs';
          import { checkReleaseVersion } from './scripts/release-version-files.mjs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const manual = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          if (manual && (process.env.GITHUB_REF !== 'refs/heads/main' || process.env.PUBLISH_EXISTING !== 'true' || process.env.DRY_RUN !== 'false'))
            throw new Error('Publication recovery requires main, publish-existing true and dry-run false');
          if (!manual && (process.env.GITHUB_EVENT_NAME !== 'push' || !process.env.GITHUB_REF?.startsWith('refs/tags/')))
            throw new Error('Expected a tag push or explicitly authorized publication recovery');
          const tag = manual ? process.env.INPUT_TAG : process.env.GITHUB_REF_NAME;
          parseAppReleaseTag(tag);
          git('fetch', 'origin', 'main', '--tags');
          const sha = git('rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}');
          git('merge-base', '--is-ancestor', sha, 'origin/main');
          const source = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'release-source-'));
          git('worktree', 'add', '--detach', source, sha);
          try { checkReleaseVersion(source, tag); }
          catch (error) { git('worktree', 'remove', '--force', source); throw error; }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\nsource-sha=' + sha + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'RELEASE_TAG=' + tag + '\nRELEASE_SOURCE_ROOT=' + source + '\n');
          NODE

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        working-directory: ${{ env.RELEASE_SOURCE_ROOT }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" bash "$GITHUB_WORKSPACE/scripts/gen-update-log.sh"
        shell: bash

      - name: Set Env
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> "$GITHUB_ENV"
          TAG_REF="$RELEASE_TAG"
          echo "TAG_NAME=$TAG_REF" >> "$GITHUB_ENV"
          VERSION="${TAG_REF#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG_REF" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          if [ -z "${UPDATE_LOGS:-}" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          ## Download

          ### Windows
          - [Windows x64 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64-setup.exe)
          - [Windows x64 portable](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_portable.exe)
          - [Windows arm64 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_arm64-setup.exe)
          - [Windows arm64 portable](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_arm64_portable.exe)
          - [Windows x64 fixed WebView2 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_fixed_webview2-setup.exe)
          - [Windows x64 fixed WebView2 portable](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_fixed_webview2_portable.zip)

          ### macOS
          - [macOS Apple Silicon DMG](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_aarch64.dmg)
          - [macOS Apple Silicon updater archive](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_aarch64.app.tar.gz)
          - [macOS Intel DMG](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64.dmg)
          - [macOS Intel updater archive](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64.app.tar.gz)

          ### Linux
          - [Linux amd64 DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_amd64.deb)
          - [Linux x86_64 RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x86_64.rpm)
          - [Linux arm64 DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_arm64.deb)
          - [Linux aarch64 RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_aarch64.rpm)
          - [Linux armhf DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_armhf.deb)
          - [Linux armv7hl RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_armv7hl.rpm)

          ### Android
          - [Android arm64 APK](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_android_arm64-v8a.apk)

          ### Download Acceleration Service
          - [MirrorChyan](https://mirrorchyan.com/)

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          node scripts/release-publication.mjs "$TAG_NAME" release.txt

      - name: Remove temporary source checkout
        if: always() && env.RELEASE_SOURCE_ROOT != ''
        shell: bash
        run: git worktree remove --force "$RELEASE_SOURCE_ROOT"

  mirrorchyan-uploading:
    if: ${{ always() && !cancelled() && needs.update_tag.result == 'success' }}
    name: Upload installers to MirrorChyan
    needs: [update_tag]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mirrorchyan_release.yml
    with:
      tag: ${{ needs.update_tag.outputs.tag }}
    secrets:
      MirrorChyanUploadToken: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan-release-note:
    if: ${{ always() && !cancelled() && needs.mirrorchyan-uploading.result == 'success' && needs.update_tag.result == 'success' }}
    name: Sync MirrorChyan release notes
    needs: [update_tag, mirrorchyan-uploading]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mirrorchyan_release_note.yml
    with:
      tag: ${{ needs.update_tag.outputs.tag }}
    secrets:
      MirrorChyanUploadToken: ${{ secrets.MirrorChyanUploadToken }}

  release-update:
    if: ${{ always() && !cancelled() && needs.update_tag.result == 'success' }}
    name: Publish updater manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [update_tag]
    outputs:
      tag: ${{ needs.update_tag.outputs.tag }}
      source-sha: ${{ needs.update_tag.outputs.source-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Publish standard updater manifest
        run: bun run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fixed WebView2 updater manifest
        if: ${{ !contains(needs.update_tag.outputs.tag, '.rc') }}
        run: bun run updater-fixed-webview2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror-to-upstream:
    name: Mirror published release to upstream
    needs: [release-update]
    if: ${{ always() && !cancelled() && github.repository == 'Kiramei/baas-tauri' && ((github.event_name == 'workflow_dispatch' && !inputs['publish-existing']) || (needs.release-update.result == 'success' && !contains(needs.release-update.outputs.tag, '.rc'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A mirror failure is visible here, but cannot fail source publication or its distributors.
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: mirror-upstream-release
      queue: max
    steps:
      - name: Checkout mirror implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate target authentication
        if: github.event_name != 'workflow_dispatch' || !inputs['dry-run']
        shell: bash
        env:
          APP_ID: ${{ vars.UPSTREAM_MIRROR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.UPSTREAM_MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TOKEN: ${{ secrets.UPSTREAM_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_ID" ]]; then
            if [[ -z "$APP_PRIVATE_KEY" ]]; then
              echo '::error::UPSTREAM_MIRROR_APP_PRIVATE_KEY is required when UPSTREAM_MIRROR_APP_ID is configured.'
              exit 1
            fi
          elif [[ -z "$MIRROR_TOKEN" ]]; then
            echo '::error::Configure the upstream GitHub App or UPSTREAM_MIRROR_TOKEN. The source GITHUB_TOKEN cannot write to the target repository.'
            exit 1
          fi

      - name: Create target repository token
        id: target-app
        if: vars.UPSTREAM_MIRROR_APP_ID != '' && (github.event_name != 'workflow_dispatch' || !inputs['dry-run'])
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UPSTREAM_MIRROR_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_MIRROR_APP_PRIVATE_KEY }}
          owner: pur1fying
          repositories: blue_archive_auto_script
          permission-contents: write

      - name: Mirror existing GitHub Release
        id: mirror
        uses: ./.github/actions/mirror-upstream-release
        with:
          source-token: ${{ github.token }}
          target-token: ${{ steps.target-app.outputs.token || secrets.UPSTREAM_MIRROR_TOKEN }}
          source-repository: ${{ github.repository }}
          target-repository: pur1fying/blue_archive_auto_script
          tag-name: ${{ needs.release-update.outputs.tag || inputs['mirror-tag'] }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || false }}

      - name: Report mirror failure
        if: failure()
        shell: bash
        run: |
          echo '::warning title=Upstream mirror failed::Source publication is unaffected. Inspect this job and retry through Release App with mirror-tag; no rebuild is needed.'
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Upstream Release mirror failed

          Source Release publication, CNB, Winget and QQ notification keep their existing dependencies.
          Inspect the failed step, then run **Release App** manually with the existing source `mirror-tag`.
          Start with `dry-run: true`; set it to `false` to resume the mirror without rebuilding.
          EOF

  sync-to-cnb-release:
    if: ${{ always() && !cancelled() && needs.release-update.result == 'success' && !contains(needs.release-update.outputs.tag, '.rc') }}
    name: Sync release to CNB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [release-update]
    outputs:
      tag: ${{ needs.release-update.outputs.tag }}
      source-sha: ${{ needs.release-update.outputs.source-sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for release promotion
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Determine CNB Latest from published app versions
        id: cnb-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-update.outputs.tag }}
        run: |
          set -euo pipefail
          node --version
          gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' > "$RUNNER_TEMP/cnb-promotion-releases.json"
          node scripts/ci/release-contract.mjs promote "$RELEASE_TAG" < "$RUNNER_TEMP/cnb-promotion-releases.json" > "$RUNNER_TEMP/cnb-promotion-decision.txt"
          decision="$(cat "$RUNNER_TEMP/cnb-promotion-decision.txt")"
          if [[ "$decision" != true && "$decision" != false ]]; then exit 1; fi
          echo "promote=$decision" >> "$GITHUB_OUTPUT"

      - name: Sync CNB release
        uses: ./.github/actions/sync-cnb-release
        with:
          github-token: ${{ github.token }}
          cnb-token: ${{ secrets.RELEASE_TO_CNB }}
          tag-name: ${{ needs.release-update.outputs.tag }}
          cnb-repo-slug: kiramei/baas-tauri
          asset-pattern: "*"
          wait-timeout-minutes: "0"
          poll-interval-seconds: "60"
          minimum-assets: "1"
          asset-contract: app
          make-latest: ${{ steps.cnb-latest.outputs.promote }}
          sync-tag: "true"
          upload-assets: "true"
          overwrite-assets: "true"

      - name: Sync CNB release
        uses: ./.github/actions/sync-cnb-release
        with:
          github-token: ${{ github.token }}
          cnb-token: ${{ secrets.RELEASE_TO_CNB }}
          tag-name: updater
          cnb-repo-slug: kiramei/baas-tauri
          asset-pattern: "*"
          wait-timeout-minutes: "0"
          poll-interval-seconds: "60"
          minimum-assets: "1"
          asset-contract: updater
          make-latest: "false"
          sync-tag: "true"
          upload-assets: "true"
          overwrite-assets: "true"

  submit-to-winget:
    # Do not submit 0.x previews or release candidates to Winget.
    if: ${{ always() && !cancelled() && needs.sync-to-cnb-release.result == 'success' && !startsWith(needs.sync-to-cnb-release.outputs.tag, '0.') && !startsWith(needs.sync-to-cnb-release.outputs.tag, 'v0.') && !contains(needs.sync-to-cnb-release.outputs.tag, '.rc') }}
    name: Submit to Winget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [sync-to-cnb-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync-to-cnb-release.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get Version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -pe '(require("./package.json").releaseVersion ?? require("./package.json").version)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check Winget package registration
        id: winget-package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/k/Kiramei/BAASTauri')"

          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Winget package not registered::Kiramei.BAASTauri needs an initial manifest in microsoft/winget-pkgs before automatic updates can run."
              ;;
            *)
              echo "Unexpected GitHub API status while checking Winget registration: $status" >&2
              exit 1
              ;;
          esac

      - name: Submit to Winget
        if: steps.winget-package.outputs.exists == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Kiramei.BAASTauri
          version: ${{ env.VERSION }}
          release-tag: ${{ needs.sync-to-cnb-release.outputs.tag }}
          installers-regex: '_(arm64|x64)-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  notify-qq:
    name: Notify QQ after publication
    needs: [sync-to-cnb-release, submit-to-winget]
    if: ${{ always() && !cancelled() && needs.sync-to-cnb-release.result == 'success' && (needs.submit-to-winget.result == 'success' || needs.submit-to-winget.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/notify-qq
        with:
          webhook-secret: ${{ secrets.QQ_RELEASE_WEBHOOK_SECRET }}
          github-token: ${{ github.token }}
          tag-name: ${{ needs.sync-to-cnb-release.outputs.tag }}
