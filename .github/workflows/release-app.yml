# This is modified from clash-verge-rev project, thanks for their efforts.

name: Release App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_tag_version:
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        uses: ./.github/actions/check-release-tag

  create_release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check_tag_version]
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, reuse it."
            exit 0
          fi

          args=(
            --repo "$GH_REPO"
            --draft
            --title "BAAS Tauri App $TAG_NAME"
            --notes "Draft release, will be updated later."
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG_NAME" "${args[@]}"

  generate_fonts:
    name: Generate font assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check_tag_version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  release:
    name: Release Build
    needs: [create_release, generate_fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dist_arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            dist_arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            dist_arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            dist_arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          save-cache: "true"

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Build native C++ service for packaging
        if: matrix.target != 'aarch64-pc-windows-msvc'
        uses: ./.github/actions/build-cpp-service
        with:
          target: ${{ matrix.target }}

      - name: Install x86 OpenSSL (macOS only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Tauri build
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun run tauri:build:cpp-service -- --target ${{ matrix.target }}

      - name: Tauri build without C++ service (unsupported target)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}".TrimStart("v")
          $arch = "${{ matrix.dist_arch }}"
          $src = "target\${{ matrix.target }}\release\bundle\nsis"
          $dst = "release-assets"

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $exe = Get-ChildItem $src -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS setup exe found in $src"
          }
          Copy-Item $exe.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.exe" -Force

          $releaseDir = "target\${{ matrix.target }}\release"
          $portableCandidates = @(
            "baas-tauri.exe",
            "BAAS Tauri.exe",
            "BAAS.Tauri.exe"
          )
          $portable = $null
          foreach ($candidate in $portableCandidates) {
            $candidatePath = Join-Path $releaseDir $candidate
            if (Test-Path $candidatePath) {
              $portable = Get-Item $candidatePath
              break
            }
          }
          if (-not $portable) {
            $portable = Get-ChildItem $releaseDir -File -Filter "*.exe" |
              Where-Object {
                $_.Name -notlike "*setup*" -and
                $_.Name -notlike "unins*" -and
                $_.Name -notlike "*bootstrapper*"
              } |
              Select-Object -First 1
          }
          if (-not $portable) {
            throw "No portable application exe found in $releaseDir"
          }
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            # The x64 frontend selects the C++ runtime, so only publish its
            # resource-complete ZIP; a naked portable exe cannot start it.
            $service = "src-tauri\resources\BAAS_service.exe"
            $remoteJar = "src-tauri\resources\ws-scrcpy-server.jar"
            if (-not $env:BAAS_CPP_SERVICE_PATH) {
              throw "BAAS_CPP_SERVICE_PATH is required for the x64 portable bundle"
            }
            if (-not $env:BAAS_CPP_SERVICE_REMOTE_JAR) {
              throw "BAAS_CPP_SERVICE_REMOTE_JAR is required for the x64 portable bundle"
            }
            if (-not (Test-Path $service)) {
              throw "Verified x64 C++ service is missing from $service"
            }
            $identity = (& $service --version | Out-String).Trim()
            if ($identity -notmatch '^BAAS_service \d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
              throw "Unexpected staged C++ service identity: $identity"
            }
            if ((Get-FileHash $service -Algorithm SHA256).Hash -ne (Get-FileHash $env:BAAS_CPP_SERVICE_PATH -Algorithm SHA256).Hash) {
              throw "Staged x64 C++ service differs from BAAS_CPP_SERVICE_PATH"
            }
            if ((Split-Path $env:BAAS_CPP_SERVICE_REMOTE_JAR -Leaf) -cne "scrcpy-server.jar") {
              throw "BAAS_CPP_SERVICE_REMOTE_JAR must be named exactly scrcpy-server.jar"
            }
            if (-not (Test-Path $remoteJar -PathType Leaf)) {
              throw "Verified ws-scrcpy resource is missing from $remoteJar"
            }
            if ((Get-Item $remoteJar).Length -eq 0 -or (Get-Item $env:BAAS_CPP_SERVICE_REMOTE_JAR).Length -eq 0) {
              throw "ws-scrcpy resource must be non-empty"
            }
            if ((Get-FileHash $remoteJar -Algorithm SHA256).Hash -ne (Get-FileHash $env:BAAS_CPP_SERVICE_REMOTE_JAR -Algorithm SHA256).Hash) {
              throw "Staged ws-scrcpy resource differs from BAAS_CPP_SERVICE_REMOTE_JAR"
            }
            $portableDir = Join-Path $env:RUNNER_TEMP "baas-portable-$arch"
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $portable.FullName (Join-Path $portableDir $portable.Name) -Force
            Copy-Item $service (Join-Path $portableDir "BAAS_service.exe") -Force
            Copy-Item $remoteJar (Join-Path $portableDir "ws-scrcpy-server.jar") -Force
            $portableZip = "$dst\BAAS.Tauri_${version}_${arch}_portable.zip"
            Compress-Archive -Path "$portableDir\*" -DestinationPath $portableZip -Force
            $entries = @(tar -tf $portableZip)
            foreach ($required in @($portable.Name, "BAAS_service.exe", "ws-scrcpy-server.jar")) {
              if ($entries -notcontains $required) {
                throw "Portable archive is missing required entry $required"
              }
            }
          } else {
            Copy-Item $portable.FullName "$dst\BAAS.Tauri_${version}_${arch}_portable.exe" -Force
          }

          $sig = Get-ChildItem $src -File -Filter "*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.exe.sig" -Force
          }

          $zip = Get-ChildItem $src -File -Filter "*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "$dst\BAAS.Tauri_${version}_${arch}-setup.nsis.zip" -Force
          }

          Get-ChildItem $dst -File | Sort-Object Name

      - name: Normalize macOS artifacts
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.dist_arch }}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          FOUND=0

          DMG="$(find "$SRC/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1 || true)"
          if [ -n "$DMG" ]; then
            cp -v "$DMG" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.dmg"
            FOUND=1
          fi

          DMG_SIG="$(find "$SRC/dmg" -maxdepth 1 -type f -name '*.dmg.sig' | head -n 1 || true)"
          if [ -n "$DMG_SIG" ]; then
            cp -v "$DMG_SIG" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.dmg.sig"
          fi

          APP_TAR="$(find "$SRC/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1 || true)"
          if [ -n "$APP_TAR" ]; then
            cp -v "$APP_TAR" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.app.tar.gz"
            FOUND=1
          fi

          APP_TAR_SIG="$(find "$SRC/macos" -maxdepth 1 -type f -name '*.app.tar.gz.sig' | head -n 1 || true)"
          if [ -n "$APP_TAR_SIG" ]; then
            cp -v "$APP_TAR_SIG" "$DST/BAAS.Tauri_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No macOS bundle found in $SRC/dmg or $SRC/macos"
            exit 1
          fi

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Normalize Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          DEB="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1 || true)"
          if [ -z "$DEB" ]; then
            echo "::error::No deb package found in $SRC/deb"
            exit 1
          fi
          cp -v "$DEB" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb"

          DEB_SIG="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb.sig' | head -n 1 || true)"
          if [ -n "$DEB_SIG" ]; then
            cp -v "$DEB_SIG" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb.sig"
          fi

          RPM="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "$RPM" ]; then
            echo "::error::No rpm package found in $SRC/rpm"
            exit 1
          fi
          cp -v "$RPM" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm"

          RPM_SIG="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm.sig' | head -n 1 || true)"
          if [ -n "$RPM_SIG" ]; then
            cp -v "$RPM_SIG" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm.sig"
          fi

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Attest release bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload normalized release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: release-assets/*

  release-for-linux-arm:
    name: Release Build for Linux ARM
    needs: [create_release, generate_fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            linker: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            gcc_package: gcc-aarch64-linux-gnu
            gxx_package: g++-aarch64-linux-gnu
            multiarch_triplet: aarch64-linux-gnu
            pkg_config_path: /usr/lib/aarch64-linux-gnu/pkgconfig
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            arch: armhf
            deb_arch: armhf
            rpm_arch: armv7hl
            linker: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            gcc_package: gcc-arm-linux-gnueabihf
            gxx_package: g++-arm-linux-gnueabihf
            multiarch_triplet: arm-linux-gnueabihf
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          save-cache: "true"

      - name: Setup Linux ARM cross dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /etc/apt/sources.list.d.disabled
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec mv {} /etc/apt/sources.list.d.disabled/ \;

          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted

          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF

          if [ -f /etc/apt/sources.list ]; then
            sudo cp /etc/apt/sources.list /etc/apt/sources.list.default
          fi
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.gcc_package }} \
            ${{ matrix.gxx_package }} \
            pkg-config \
            libxslt1.1:${{ matrix.arch }} \
            libcups2:${{ matrix.arch }} \
            libgtk-3-dev:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }} \
            patchelf \
            rpm

      - name: Configure Linux ARM cross env
        shell: bash
        run: |
          set -euo pipefail

          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${{ matrix.pkg_config_path }}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.multiarch_triplet }}/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> "$GITHUB_ENV"

          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
            echo "CC_aarch64_unknown_linux_gnu=${{ matrix.linker }}" >> "$GITHUB_ENV"
            echo "CXX_aarch64_unknown_linux_gnu=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
            echo "CC_armv7_unknown_linux_gnueabihf=${{ matrix.linker }}" >> "$GITHUB_ENV"
            echo "CXX_armv7_unknown_linux_gnueabihf=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          fi

      - name: Tauri build
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize Linux ARM artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/bundle"
          DST="release-assets"

          rm -rf "$DST"
          mkdir -p "$DST"

          DEB="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1 || true)"
          if [ -z "$DEB" ]; then
            echo "::error::No deb package found in $SRC/deb"
            exit 1
          fi
          cp -v "$DEB" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb"

          DEB_SIG="$(find "$SRC/deb" -maxdepth 1 -type f -name '*.deb.sig' | head -n 1 || true)"
          if [ -n "$DEB_SIG" ]; then
            cp -v "$DEB_SIG" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.deb_arch }}.deb.sig"
          fi

          RPM="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "$RPM" ]; then
            echo "::error::No rpm package found in $SRC/rpm"
            exit 1
          fi
          cp -v "$RPM" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm"

          RPM_SIG="$(find "$SRC/rpm" -maxdepth 1 -type f -name '*.rpm.sig' | head -n 1 || true)"
          if [ -n "$RPM_SIG" ]; then
            cp -v "$RPM_SIG" "$DST/BAAS.Tauri_${VERSION}_${{ matrix.rpm_arch }}.rpm.sig"
          fi

          find "$DST" -maxdepth 1 -type f -print | sort

      - name: Attest Linux bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload normalized release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: release-assets/*

  release-android:
    name: Release Build for Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: [create_release, generate_fonts]
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: aarch64-linux-android
          save-cache: "true"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make perl unzip

          SDKMANAGER="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to build a signed Android release APK."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/baas-android-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build Android arm64 release APK
        shell: bash
        run: bun run tauri:android:build:release -- --abi arm64

      - name: Normalize Android APK artifact
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          SRC="src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
          DST="release-assets"

          if [ ! -f "$SRC" ]; then
            echo "::error::No Android release APK found at $SRC"
            exit 1
          fi

          rm -rf "$DST"
          mkdir -p "$DST"
          cp -v "$SRC" "$DST/BAAS.Tauri_${VERSION}_android_arm64-v8a.apk"
          ls -lah "$DST"

      - name: Attest Android APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload Android release APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: release-assets/*

  release-for-fixed-webview2:
    name: Release Build for Fixed WebView2
    needs: [create_release, generate_fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri-build-env
        with:
          target: ${{ matrix.target }}
          save-cache: "true"

      - name: Build native C++ service for packaging
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ./.github/actions/build-cpp-service
        with:
          target: ${{ matrix.target }}

      - name: Download WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "133.0.3065.92"
          $arch = "${{ matrix.arch }}"
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.$arch.cab"
          $url = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab"

          Invoke-WebRequest -Uri $url -OutFile $cab
          expand.exe ".\$cab" -F:* ".\src-tauri"

          Remove-Item ".\src-tauri\tauri.windows.conf.json" -Force
          Rename-Item ".\src-tauri\webview2.$arch.json" "tauri.windows.conf.json"

      - name: Tauri build with C++ service
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun run tauri:build:cpp-service -- --target ${{ matrix.target }}

      - name: Tauri build without C++ service (unsupported target)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }}

      - name: Normalize fixed WebView2 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}".TrimStart("v")
          $arch = "${{ matrix.arch }}"
          $src = "target\${{ matrix.target }}\release\bundle\nsis"
          $dst = "release-assets"

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $exe = Get-ChildItem $src -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS setup exe found in $src"
          }
          Copy-Item $exe.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.exe" -Force

          $sig = Get-ChildItem $src -File -Filter "*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.exe.sig" -Force
          }

          $zip = Get-ChildItem $src -File -Filter "*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "$dst\BAAS.Tauri_${version}_${arch}_fixed_webview2-setup.nsis.zip" -Force
          }

          Get-ChildItem $dst -File | Sort-Object Name

      - name: Attest Windows bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload fixed WebView2 release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: release-assets/*

      - name: Portable Bundle
        run: bun run portable-fixed-webview2 ${{ matrix.target }}

      - name: Upload fixed WebView2 portable bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "BAAS Tauri App ${{ github.ref_name }}"
          body: "Draft release, will be updated later."
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
          overwrite_files: true
          files: BAAS.Tauri_*_${{ matrix.arch }}_fixed_webview2_portable.zip

  update_tag:
    name: Update tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release, release-for-linux-arm, release-android, release-for-fixed-webview2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/gen-update-log.sh
        shell: bash

      - name: Set Env
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> "$GITHUB_ENV"
          TAG_REF="${GITHUB_REF##*/}"
          echo "TAG_NAME=$TAG_REF" >> "$GITHUB_ENV"
          VERSION="${TAG_REF#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG_REF" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          if [ -z "${UPDATE_LOGS:-}" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          ## Download

          ### Windows
          - [Windows x64 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64-setup.exe)
          - [Windows x64 portable with C++ service](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_portable.zip)
          - [Windows arm64 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_arm64-setup.exe)
          - [Windows arm64 portable](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_arm64_portable.exe)
          - [Windows x64 fixed WebView2 installer](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_fixed_webview2-setup.exe)
          - [Windows x64 fixed WebView2 portable](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64_fixed_webview2_portable.zip)

          ### macOS
          - [macOS Apple Silicon DMG](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_aarch64.dmg)
          - [macOS Apple Silicon updater archive](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_aarch64.app.tar.gz)
          - [macOS Intel DMG](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64.dmg)
          - [macOS Intel updater archive](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x64.app.tar.gz)

          ### Linux
          - [Linux amd64 DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_amd64.deb)
          - [Linux x86_64 RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_x86_64.rpm)
          - [Linux arm64 DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_arm64.deb)
          - [Linux aarch64 RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_aarch64.rpm)
          - [Linux armhf DEB](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_armhf.deb)
          - [Linux armv7hl RPM](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_armv7hl.rpm)

          ### Android
          - [Android arm64 APK](${{ env.DOWNLOAD_URL }}/BAAS.Tauri_${{ env.VERSION }}_android_arm64-v8a.apk)

          ### Download Acceleration Service
          - [MirrorChyan](https://mirrorchyan.com/)

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') }}
        shell: bash
        run: |
          set -euo pipefail

          matches="$(gh api repos/{owner}/{repo}/releases --paginate --jq '.[] | select(.tag_name == env.TAG_NAME) | [.id, .draft, (.assets | length), .html_url] | @tsv')"
          release_count="$(grep -c . <<< "$matches" || true)"

          if [ "$release_count" -eq 0 ]; then
            echo "::error::No release found for $TAG_NAME."
            exit 1
          fi

          if [ "$release_count" -gt 1 ]; then
            printf '%s\n' "$matches"
            echo "::error::Multiple releases found for $TAG_NAME. Merge or delete duplicate releases before rerunning."
            exit 1
          fi

          IFS=$'\t' read -r release_id _ asset_count release_url <<< "$matches"
          echo "Publishing release $release_id ($release_url) with $asset_count assets."

          gh api --method PATCH repos/{owner}/{repo}/releases/"$release_id" \
            -f name="BAAS Tauri App $TAG_NAME" \
            -F body=@release.txt \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            --silent

  release-update:
    if: ${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
    name: Publish updater manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [update_tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Publish standard updater manifest
        run: bun run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fixed WebView2 updater manifest
        run: bun run updater-fixed-webview2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-to-cnb-release:
    if: ${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
    name: Sync release to CNB
    runs-on: ubuntu-latest
    timeout-minutes: 260
    needs: [release-update]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync CNB release
        uses: ./.github/actions/sync-cnb-release
        with:
          github-token: ${{ github.token }}
          cnb-token: ${{ secrets.RELEASE_TO_CNB }}
          tag-name: ${{ github.ref_name }}
          cnb-repo-slug: kiramei/baas-tauri
          asset-pattern: "*"
          wait-timeout-minutes: "240"
          poll-interval-seconds: "60"
          minimum-assets: "1"
          make-latest: legacy
          sync-tag: "true"
          upload-assets: "true"
          overwrite-assets: "true"

      - name: Sync CNB release
        uses: ./.github/actions/sync-cnb-release
        with:
          github-token: ${{ github.token }}
          cnb-token: ${{ secrets.RELEASE_TO_CNB }}
          tag-name: updater
          cnb-repo-slug: kiramei/baas-tauri
          asset-pattern: "*"
          wait-timeout-minutes: "240"
          poll-interval-seconds: "60"
          minimum-assets: "1"
          make-latest: legacy
          sync-tag: "true"
          upload-assets: "true"
          overwrite-assets: "true"

  submit-to-winget:
    if: ${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
    name: Submit to Winget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sync-to-cnb-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -pe 'require("./package.json").version')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Submit to Winget
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Kiramei.BAASTauri
          version: ${{ env.VERSION }}
          release-tag: v${{ env.VERSION }}
          installers-regex: '_(arm64|x64)-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
