name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: wiki-bun-${{ runner.os }}-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            wiki-bun-${{ runner.os }}-

      - name: Setup Python for font subsetting
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install font subset tooling
        run: python -m pip install --disable-pip-version-check fonttools brotli

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build Blueaka font subset
        working-directory: docs
        run: bun run build:fonts

      - name: Build static wiki
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build:next

      - name: Check static links and assets
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run check:links

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/out

  deploy:
    name: Deploy wiki
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
