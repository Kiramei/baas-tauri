name: Release WebUI Docker Image

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing app release tag to recover; leave empty to build the selected branch
        required: false
        default: ""
        type: string
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-docker-publication
  queue: max

env:
  IMAGE_NAME: ghcr.io/kiramei/baas-webui
  CNB_IMAGE_NAME: docker.cnb.cool/kiramei/baas-tauri/baas-webui

jobs:
  prepare:
    name: Validate release and generate fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release-tag: ${{ steps.source.outputs.release-tag }}
      image-version: ${{ steps.source.outputs.image-version }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      source-short-sha: ${{ steps.source.outputs.source-short-sha }}
      publish-image: ${{ steps.source.outputs.publish-image }}
      publish-latest: ${{ steps.source.outputs.publish-latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for release validation
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve and validate image source
        id: source
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          node --version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { parseReleaseVersion } from './src/shared/ReleaseVersion.mjs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const input = process.env.INPUT_RELEASE_TAG || '';
          const ref = process.env.GITHUB_REF;
          if (input && (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || ref !== 'refs/heads/main')) {
            throw new Error('Release recovery must run the workflow from main');
          }
          const tag = input || (ref?.startsWith('refs/tags/') ? process.env.GITHUB_REF_NAME : '');
          const parsed = tag ? parseReleaseVersion(tag.replace(/^v/, '')) : null;
          if (tag && (!parsed || (tag !== parsed.canonical && tag !== 'v' + parsed.canonical))) {
            throw new Error('Expected an app release tag with one optional v prefix');
          }
          if (tag) git('fetch', 'origin', 'main', '--tags');
          const sha = git('rev-parse', '--verify', tag ? 'refs/tags/' + tag + '^{commit}' : 'HEAD^{commit}');
          if (tag) git('merge-base', '--is-ancestor', sha, 'origin/main');
          const publish = Boolean(tag || ref === 'refs/heads/main');
          const values = {
            'release-tag': tag,
            'image-version': parsed?.canonical || '',
            'source-sha': sha,
            'source-short-sha': sha.slice(0, 7),
            'publish-image': publish,
            'publish-latest': publish && parsed?.kind !== 'rc',
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => key + '=' + value + '\n').join(''));
          NODE

      - name: Checkout validated image source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          persist-credentials: false

      - name: Check selected release version
        if: steps.source.outputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      promoted: ${{ steps.promotion.outputs.latest }}
      publish-image: ${{ needs.prepare.outputs.publish-image }}
      release-tag: ${{ needs.prepare.outputs.release-tag }}
      image-version: ${{ needs.prepare.outputs.image-version }}
    needs: prepare
    env:
      PUBLISH_IMAGE: ${{ needs.prepare.outputs.publish-image }}
      PUBLISH_LATEST: ${{ needs.prepare.outputs.publish-latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Node for release promotion
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download generated font assets
        uses: ./.github/actions/download-font-assets

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Refresh bundled release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-client-release-history.mjs

      - name: Build WebUI assets
        run: bun run build:webui

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./scripts/docker/dist
          mkdir -p ./scripts/docker/dist
          cp -a ./dist/. ./scripts/docker/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve canonical image version
        id: image-version
        shell: bash
        env:
          IMAGE_VERSION: ${{ needs.prepare.outputs.image-version }}
        run: |
          set -euo pipefail
          echo "version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Avoid promoting an older stable version
        if: env.PUBLISH_LATEST == 'true' && needs.prepare.outputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          set -euo pipefail
          node --version
          # App and container builds run independently. Include unpublished app tags
          # by recording the currently published image's version as well.
          prior="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{json .Image}}' 2>"$RUNNER_TEMP/inspect-latest.err")" || {
            if grep -Eiq 'manifest unknown|not found' "$RUNNER_TEMP/inspect-latest.err"; then prior='{}'; else cat "$RUNNER_TEMP/inspect-latest.err" >&2; exit 1; fi
          }
          previous_tag="$(jq -r '.. | objects | .["org.opencontainers.image.version"]? // empty' <<< "$prior" | sort -u)"
          if [[ "$previous_tag" == *$'\n'* ]]; then echo "::error::Latest image platforms disagree on version"; exit 1; fi
          promotion_dir="$(mktemp -d "$RUNNER_TEMP/docker-promotion.XXXXXX")"
          trap 'rm -rf "$promotion_dir"' EXIT
          gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' > "$promotion_dir/releases.json" || {
            code=$?
            echo '::error::Could not list releases for Docker promotion' >&2
            exit "$code"
          }
          jq --arg prior "$previous_tag" 'flatten + [{tag_name:$prior}]' "$promotion_dir/releases.json" > "$promotion_dir/candidates.json" || {
            code=$?
            echo '::error::Could not prepare Docker promotion candidates' >&2
            exit "$code"
          }
          node scripts/ci/release-contract.mjs promote "$TAG" < "$promotion_dir/candidates.json" > "$promotion_dir/decision.txt" || {
            code=$?
            echo '::error::Release comparison failed before publishing the Docker image' >&2
            exit "$code"
          }
          candidate="$(cat "$promotion_dir/decision.txt")"
          if [[ "$candidate" != true && "$candidate" != false ]]; then
            echo '::error::Release promotion returned an invalid decision'
            exit 1
          fi
          echo "PUBLISH_LATEST=$candidate" >> "$GITHUB_ENV"

      - name: Extract GitHub Container Registry metadata
        id: ghcr-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ needs.prepare.outputs.release-tag == '' }}
            type=raw,value=${{ steps.image-version.outputs.version }},enable=${{ needs.prepare.outputs.release-tag != '' }}
            type=raw,value=sha-${{ needs.prepare.outputs.source-short-sha }}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source-sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image-version || github.ref_name }}

      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        if: env.PUBLISH_IMAGE == 'true'
        id: dockerhub-meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/baas-webui
          tags: |
            type=raw,value=${{ steps.image-version.outputs.version }},enable=${{ needs.prepare.outputs.release-tag != '' }}
            type=raw,value=main,enable=${{ needs.prepare.outputs.release-tag == '' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST == 'true' }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/docker
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: |
            ${{ steps.ghcr-meta.outputs.tags }}
            ${{ steps.dockerhub-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record promotion for mirror recovery
        id: promotion
        run: echo "latest=$PUBLISH_LATEST" >> "$GITHUB_OUTPUT"

  mirror:
    name: Mirror published Docker Hub image to CNB
    needs: build-and-push
    if: needs.build-and-push.outputs.publish-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PUBLISH_IMAGE: ${{ needs.build-and-push.outputs.publish-image }}
      PUBLISH_LATEST: ${{ needs.build-and-push.outputs.promoted }}
    steps:
      - name: Install skopeo
        if: env.PUBLISH_IMAGE == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Mirror Docker Hub image to CNB
        if: env.PUBLISH_IMAGE == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CNB_DOCKER_TOKEN: ${{ secrets.CNB_DOCKER_TOKEN }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.release-tag }}
          IMAGE_VERSION: ${{ needs.build-and-push.outputs.image-version }}
        run: |
          set -euo pipefail
          source_image="docker.io/${DOCKERHUB_USERNAME}/baas-webui"
          if [[ -n "$RELEASE_TAG" ]]; then
            tags=("$IMAGE_VERSION")
          else
            tags=(main)
          fi
          if [[ "$PUBLISH_LATEST" == true ]]; then
            tags+=(latest)
          fi

          for tag in "${tags[@]}"; do
            echo "Mirroring ${source_image}:${tag} to ${CNB_IMAGE_NAME}:${tag}"
            skopeo copy --all \
              "docker://${source_image}:${tag}" \
              "docker://${CNB_IMAGE_NAME}:${tag}" \
              --src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              --dest-creds "cnb:${CNB_DOCKER_TOKEN}"
            echo "::notice title=Image Published::https://${CNB_IMAGE_NAME}:${tag}"
          done
