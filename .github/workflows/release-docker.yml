name: Build Webui Docker

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/kiramei/baas-webui
  CNB_IMAGE_NAME: docker.cnb.cool/kiramei/baas-tauri/baas-webui

jobs:
  check_tag_version:
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release tag
        uses: ./.github/actions/check-release-tag
        with:
          allow-non-tag: "true"

  generate_fonts:
    name: Generate font assets
    runs-on: ubuntu-latest
    needs: check_tag_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  build_assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    needs: generate_fonts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated font assets
        uses: ./.github/actions/download-font-assets

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Bun build with WebUI Mode
        shell: bash
        run: bun build:webui

      - name: Upload generated WebUI Assets
        uses: actions/upload-artifact@v7
        with:
          name: webui-built
          path: dist
          if-no-files-found: error

  build_image_and_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: build_assets

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download generated WebUI assets
        uses: actions/download-artifact@v8
        with:
          name: webui-built
          path: dist

      - name: Copy dist to docker build context
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ./scripts/docker/dist
          mkdir -p ./scripts/docker/dist
          cp -a ./dist/. ./scripts/docker/dist/

      - name: Inspect docker build context
        shell: bash
        run: |
          find ./scripts/docker -maxdepth 3 -type f | sort | head -100

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc')) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/docker
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc'))) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
        id: dockerhub-meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/baas-webui
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker Hub image
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/docker
          push: true
          tags: ${{ steps.dockerhub-meta.outputs.tags }}
          labels: ${{ steps.dockerhub-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install skopeo
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Mirror Docker Hub image to CNB
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CNB_DOCKER_TOKEN: ${{ secrets.CNB_DOCKER_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          source_image="docker.io/${DOCKERHUB_USERNAME}/baas-webui"

          for tag in "$version" latest; do
            echo "Mirroring ${source_image}:${tag} to ${CNB_IMAGE_NAME}:${tag}"
            skopeo copy --all \
              "docker://${source_image}:${tag}" \
              "docker://${CNB_IMAGE_NAME}:${tag}" \
              --src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              --dest-creds "cnb:${CNB_DOCKER_TOKEN}"
            echo "::notice title=Image Published::https://${CNB_IMAGE_NAME}:${tag}"
          done
