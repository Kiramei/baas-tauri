name: Release WebUI Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kiramei/baas-webui
  CNB_IMAGE_NAME: docker.cnb.cool/kiramei/baas-tauri/baas-webui
  STABLE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc') }}
  PUBLISH_IMAGE: ${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-rc')) }}

jobs:
  prepare:
    name: Validate release and generate fonts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        uses: ./.github/actions/check-release-tag
        with:
          allow-non-tag: "true"

      - name: Generate font assets
        uses: ./.github/actions/generate-font-assets

  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download generated font assets
        uses: ./.github/actions/download-font-assets

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Build WebUI assets
        run: bun run build:webui

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./scripts/docker/dist
          mkdir -p ./scripts/docker/dist
          cp -a ./dist/. ./scripts/docker/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract GitHub Container Registry metadata
        id: ghcr-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
            type=raw,value=latest,enable=${{ env.PUBLISH_IMAGE == 'true' }}

      - name: Log in to Docker Hub
        if: env.STABLE_RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        if: env.STABLE_RELEASE == 'true'
        id: dockerhub-meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/baas-webui
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/docker
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: |
            ${{ steps.ghcr-meta.outputs.tags }}
            ${{ steps.dockerhub-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install skopeo
        if: env.STABLE_RELEASE == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Mirror Docker Hub image to CNB
        if: env.STABLE_RELEASE == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CNB_DOCKER_TOKEN: ${{ secrets.CNB_DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_image="docker.io/${DOCKERHUB_USERNAME}/baas-webui"

          for tag in "$version" latest; do
            echo "Mirroring ${source_image}:${tag} to ${CNB_IMAGE_NAME}:${tag}"
            skopeo copy --all \
              "docker://${source_image}:${tag}" \
              "docker://${CNB_IMAGE_NAME}:${tag}" \
              --src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              --dest-creds "cnb:${CNB_DOCKER_TOKEN}"
            echo "::notice title=Image Published::https://${CNB_IMAGE_NAME}:${tag}"
          done
