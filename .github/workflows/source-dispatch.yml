name: Source Dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Select CNB data to synchronize, or fast-forward Dev from main.
        required: true
        default: repository
        type: choice
        options:
          - repository
          - release
          - all
          - branches
      tag-name:
        description: Release tag to sync. Defaults to the package.json version tag.
        required: false
        type: string
      asset-pattern:
        description: GitHub release asset pattern passed to gh release download.
        required: false
        default: "*"
        type: string

permissions:
  contents: read

jobs:
  sync-dev:
    if: ${{ github.repository == 'Kiramei/baas-tauri' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && github.event.forced == false && github.event.deleted == false) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'branches')) }}
    name: Fast-forward Dev from main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sync-dev-from-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require branch-sync App configuration
        env:
          APP_ID: ${{ secrets.BRANCH_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRANCH_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure BRANCH_SYNC_APP_ID and BRANCH_SYNC_APP_PRIVATE_KEY for the protected Dev fast-forward.'
            exit 1
          fi
      - name: Create a token for this repository only
        id: branch-app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.BRANCH_SYNC_APP_ID }}
          private-key: ${{ secrets.BRANCH_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Validate promotion and fast-forward Dev
        env:
          BRANCH_SYNC_TOKEN: ${{ steps.branch-app.outputs.token }}
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'push' && github.event.after || github.sha }}
        run: node scripts/ci/sync-dev.mjs

  sync-repository:
    if: ${{ github.event_name == 'push' || inputs.operation == 'repository' || inputs.operation == 'all' }}
    name: Sync repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sync-cnb-repository
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync Git repository to CNB
        if: github.repository == 'Kiramei/baas-tauri'
        uses: ./.github/actions/sync-to-cnb
        with:
          target-url: https://cnb.cool/kiramei/baas-tauri.git
          password: ${{ secrets.CNB_SYNC_TOKEN }}

  sync-release:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'release' || inputs.operation == 'all') }}
    name: Sync release
    runs-on: ubuntu-latest
    timeout-minutes: 260
    concurrency:
      group: ${{ startsWith(inputs.tag-name, 'baasx-v') && 'release-baasx-publication' || 'release-app-publication' }}
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync GitHub release to CNB
        uses: ./.github/actions/sync-cnb-release
        with:
          github-token: ${{ github.token }}
          cnb-token: ${{ secrets.RELEASE_TO_CNB }}
          tag-name: ${{ inputs.tag-name || '' }}
          cnb-repo-slug: kiramei/baas-tauri
          asset-pattern: ${{ inputs.asset-pattern || '*' }}
          wait-timeout-minutes: "240"
          poll-interval-seconds: "60"
          minimum-assets: "1"
          make-latest: legacy
          sync-tag: "true"
          upload-assets: "true"
          overwrite-assets: "true"
