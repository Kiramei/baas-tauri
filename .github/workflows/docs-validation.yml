name: Validate Documentation Export

on:
  push:
    branches:
      - "docs/**"
    paths:
      - "docs/**"
      - "!docs/refresh-audit.md"
      - "!docs/README.md"
      - "!docs/evidence/deployment-validation.json"
      - "!docs/evidence/android-diagnostics-layout.json"
      - "!docs/evidence/android-native-layout.json"
      - "!docs/evidence/recognition-layout-validation.json"
      - "!docs/evidence/search-recovery.json"
      - "!docs/evidence/updater-layout.json"
      - "!docs/evidence/native-payload-layout.json"
      - "!docs/evidence/android-local-layout.json"
      - ".github/workflows/docs-validation.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-export:
    name: Linux static export (${{ matrix.base_path || 'root' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base_path: ["", "/baas-tauri"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Install font and browser tooling
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check paths and strict static host
        run: bun test docs/tests/doc-links.test.ts docs/tests/locale.test.ts docs/tests/public-asset-links.test.ts docs/tests/static-export-server.test.ts docs/tests/static-export-normalization.test.ts docs/tests/native-payload.test.ts docs/tests/android-local.test.ts docs/tests/search-encoding.test.ts docs/tests/search-index.test.ts
      - name: Build static export
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ matrix.base_path }}
        run: bun run build
      - name: Check exported navigation and media
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
          DOCS_BASE_PATH: ${{ matrix.base_path }}
        run: node docs/scripts/check-deployment.mjs --base-path "$DOCS_BASE_PATH" --channel chromium
      - name: Check large-config benchmark controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
          DOCS_BASE_PATH: ${{ matrix.base_path }}
        run: node docs/scripts/check-native-payload.mjs --base-path "$DOCS_BASE_PATH" --channel chromium
      - name: Check Android local benchmark controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
          DOCS_BASE_PATH: ${{ matrix.base_path }}
        run: node docs/scripts/check-android-local.mjs --base-path "$DOCS_BASE_PATH" --channel chromium
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-deployment-${{ matrix.base_path && 'prefixed' || 'root' }}
          path: .cache/deployment/
          if-no-files-found: ignore
