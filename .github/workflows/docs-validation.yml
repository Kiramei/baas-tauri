name: Validate Documentation Export

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Identify documentation changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_paths="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -Eq '^(docs/|\.github/workflows/docs-validation\.yml$)' <<< "$changed_paths"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  static-export:
    name: Linux static export (root)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Historical protocol evidence is verified against its recorded Git revision.
          fetch-depth: 0
      - name: Install client types for configuration and API audits
        # Documentation contracts inspect the real client through its TypeScript project.
        uses: ./.github/actions/setup-bun-deps
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Install font and browser tooling
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build static export
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          bun run build
          mkdir -p ../.cache/deployment/search-artifact
          cp out/search-index/*.json ../.cache/deployment/search-artifact/
      - name: Check exported navigation and media
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-deployment.mjs --channel chromium
      - name: Check native API examples and type popups
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-client-api.mjs --channel chromium
      - name: Check desktop showcase images and playback
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
          DOCS_BROWSER_CHANNEL: chromium
        run: node docs/scripts/check-showcase.mjs
      - name: Check search cache and reload recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-search-cache.mjs --channel chromium
      - name: Check search error recovery against the current index
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-search-recovery.mjs --channel chromium
      - name: Check updater diagrams and localized navigation against the current index
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-updater-docs.mjs --channel chromium
      - name: Check large-config benchmark controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-native-payload.mjs --channel chromium
      - name: Check Android local benchmark controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/docs-browser/node_modules/playwright
        run: node docs/scripts/check-android-local.mjs --channel chromium
      - name: Check documentation contracts, WebP pixels and privacy provenance
        # Browser checks above regenerate source-bound evidence before it is verified.
        run: bun test docs/tests
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-deployment-root
          path: .cache/deployment/
          if-no-files-found: ignore

  documentation-gate:
    name: Dev documentation gate
    if: always()
    needs: [changes, static-export]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify documentation checks
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          EXPORT: ${{ needs.static-export.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          if [[ "$DOCS_CHANGED" == true ]]; then
            [[ "$EXPORT" == success ]]
          else
            [[ "$DOCS_CHANGED" == false && "$EXPORT" == skipped ]]
          fi
