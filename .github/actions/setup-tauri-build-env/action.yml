name: Setup Tauri Build Environment
description: Install the requested Rust toolchain and optionally prepare frontend assets and dependencies.

inputs:
  target:
    description: Rust target triple.
    required: true
  rust-toolchain:
    description: Rust toolchain version.
    required: false
    default: "1.95.0"
  font-artifact-name:
    description: Font artifact name.
    required: false
    default: generated-fonts
  download-fonts:
    description: Whether to download generated font assets.
    required: false
    default: "true"
  install-frontend:
    description: Whether to install Bun and frontend dependencies.
    required: false
    default: "true"
  bun-version:
    description: Bun version passed to oven-sh/setup-bun.
    required: false
    default: "1.3.14"
  save-cache:
    description: Whether to save a new Rust cache entry.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download generated font assets
      if: ${{ inputs.download-fonts == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.font-artifact-name }}
        path: public/fonts

    - name: Install Rust Stable
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        targets: ${{ inputs.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ inputs.save-cache == 'true' }}
        prefix-key: "v1-rust"
        key: "rust-shared-stable-${{ runner.os }}-${{ inputs.target }}"
        workspaces: |
          . -> target
        cache-all-crates: true
        cache-workspace-crates: true

    - name: Install Bun
      if: ${{ inputs.install-frontend == 'true' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Bun install
      if: ${{ inputs.install-frontend == 'true' }}
      shell: bash
      run: bun install --frozen-lockfile
