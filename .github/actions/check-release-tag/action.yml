name: Check Release Tag
description: Validate release tags with an optional v prefix, mapped native versions and release branch ancestry.

inputs:
  branch:
    description: Release source branch.
    required: false
    default: main
  allow-non-tag:
    description: Skip checks when the workflow is not running on a tag.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check if tag is from release branch
      shell: bash
      env:
        RELEASE_BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
          if [[ "${{ inputs.allow-non-tag }}" = "true" ]]; then
            echo "Current ref is not a release tag: ${GITHUB_REF}"
            echo "Skip release tag branch check."
            exit 0
          fi

          echo "::error::Current ref is not a release tag: ${GITHUB_REF}"
          exit 1
        fi
        TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
        # Public versions use x.y.z, x.y.z.rcN or x.y.z.postN. A tag may
        # have one leading v; legacy -rc spellings cannot create a release.
        node scripts/check-release-version.mjs "$TAG_REF"
        echo "Checking if tag ${TAG_REF} is from ${RELEASE_BRANCH} branch..."

        git fetch origin "$RELEASE_BRANCH" --tags
        TAG_COMMIT="$(git rev-list -n 1 "${TAG_REF}")"

        if git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${RELEASE_BRANCH}"; then
          echo "Tag ${TAG_REF} is from ${RELEASE_BRANCH} branch."
        else
          echo "::error::Tag ${TAG_REF} is not from ${RELEASE_BRANCH} branch."
          exit 1
        fi
