name: Check Release Tag
description: Validate canonical app release tags, mapped native versions and main ancestry.

inputs:
  allow-non-tag:
    description: Skip checks when the workflow is not running on a tag.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check if tag is from release branch
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
          if [[ "${{ inputs.allow-non-tag }}" = "true" ]]; then
            echo "Current ref is not a release tag: ${GITHUB_REF}"
            echo "Skip release tag branch check."
            exit 0
          fi

          echo "::error::Current ref is not a release tag: ${GITHUB_REF}"
          exit 1
        fi
        TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
        if [[ "$TAG_REF" == v* ]]; then
          echo "::error::New app release tags must omit the v prefix."
          exit 1
        fi
        node scripts/check-release-version.mjs "$TAG_REF"
        git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
        TAG_COMMIT="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"

        if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
          echo "::error::App release tags must point to commits on main."
          exit 1
        fi
