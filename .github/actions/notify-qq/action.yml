name: Notify QQ after release
description: Queue a QQ release notification after CNB synchronization.
inputs:
  webhook-secret:
    required: true
    description: Secret used to sign notification requests.
  github-token:
    required: true
    description: Token used to retrieve the published release.
  tag-name:
    required: false
    default: ${{ github.ref_name }}
    description: Published source tag; defaults to the triggering ref for existing callers.
runs:
  using: composite
  steps:
    - name: Queue notification
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        QQ_WEBHOOK_SECRET: ${{ inputs.webhook-secret }}
        RELEASE_TAG: ${{ inputs.tag-name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/qq-release.json"
        python3 - "$RUNNER_TEMP/qq-release.json" <<'PY'
        import hashlib
        import hmac
        import json
        import os
        import sys
        import time
        import urllib.error
        import urllib.request

        with open(sys.argv[1], encoding="utf-8") as file:
            release = json.load(file)
        payload = json.dumps({"action": "published", "repository": {"full_name": os.environ["REPOSITORY"]},
                              "release": release}, ensure_ascii=False).encode()
        signature = hmac.new(os.environ["QQ_WEBHOOK_SECRET"].encode(), payload, hashlib.sha256).hexdigest()
        url = "https://hs.kiramei.moe:8443/hooks/baas-qq-release"
        for attempt in range(5):
            req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json",
                "X-GitHub-Event": "release_ready", "X-Hub-Signature-256": "sha256=" + signature})
            try:
                with urllib.request.urlopen(req, timeout=15) as response:
                    if response.status != 202:
                        raise RuntimeError(f"Unexpected HTTP status {response.status}")
                print("QQ notification queued.")
                break
            except (OSError, RuntimeError) as exc:
                if attempt == 4:
                    raise SystemExit(f"Could not queue QQ notification: {exc}")
                time.sleep(5 * (attempt + 1))
        PY
