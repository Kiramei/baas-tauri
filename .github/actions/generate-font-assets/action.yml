name: Generate Font Assets
description: Generate subset font assets and upload them as an artifact.

inputs:
  artifact-name:
    description: Uploaded font artifact name.
    required: false
    default: generated-fonts
  bun-version:
    description: Bun version passed to oven-sh/setup-bun.
    required: false
    default: latest
  python-version:
    description: Python version used by the font pipeline.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Python for font generation
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install font generation dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "fonttools[woff]" brotli zopfli

    - name: Generate font assets
      shell: bash
      env:
        CI_FONT_BUILD_STRICT: "1"
      run: bun run gen:fonts

    - name: Upload generated font assets
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          public/fonts/Blueaka-Subset.woff2
          public/fonts/GmarketSans-Subset.woff2
          public/fonts/Rubik-Subset.woff2
        if-no-files-found: error
