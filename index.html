<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Archive Auto Script</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0f172a;
      }

      #baas-startup-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0f172a;
        color: #dbeafe;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      #baas-startup-shell > div {
        position: relative;
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      #baas-startup-shell strong {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: #111c31;
        box-shadow: 0 0 36px rgba(34, 211, 238, 0.45);
        color: #67e8f9;
        font-size: 28px;
        letter-spacing: 0;
      }

      #baas-startup-shell span {
        border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.64);
        padding: 8px 14px;
        font-size: 15px;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="root">
      <div id="baas-startup-shell">
        <div>
          <strong>BAAS</strong>
          <span>Starting BAAS...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
