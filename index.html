<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueArchiveAutoScript</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0f172a;
      }

      #baas-startup-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0f172a;
        color: #dbeafe;
        opacity: 1;
        pointer-events: none;
        transition: opacity 160ms ease-out;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .baas-startup-content {
        position: relative;
        display: grid;
        gap: 22px;
        justify-items: center;
      }

      .baas-startup-mark {
        position: relative;
        display: grid;
        width: 156px;
        height: 156px;
        place-items: center;
      }

      .baas-startup-mark img {
        width: 112px;
        height: 112px;
        border-radius: 999px;
        box-shadow:
          0 0 28px rgba(34, 211, 238, 0.34),
          0 0 64px rgba(34, 211, 238, 0.18);
      }

      .baas-startup-spinner {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 3px solid transparent;
        border-top-color: #22d3ee;
        border-bottom-color: #67e8f9;
        border-radius: 999px;
        filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.82));
        animation: baas-startup-spin 1.05s linear infinite;
      }

      .baas-startup-spinner::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(103, 232, 249, 0.2);
        border-radius: inherit;
      }

      @keyframes baas-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #baas-startup-shell span {
        color: rgba(219, 234, 254, 0.82);
        font-size: 14px;
      }

      #baas-startup-shell.is-leaving {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .baas-startup-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="baas-startup-shell">
      <div class="baas-startup-content">
        <div class="baas-startup-mark">
          <img src="/images/logo.png" alt="BAAS" />
          <div class="baas-startup-spinner" aria-hidden="true"></div>
        </div>
        <span>Starting BAAS...</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
