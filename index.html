<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Archive Auto Script</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0f172a;
      }

      #baas-startup-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0f172a;
        color: #dbeafe;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .baas-startup-content {
        position: relative;
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      .baas-startup-mark {
        position: relative;
        width: 160px;
        height: 160px;
      }

      .baas-startup-mark img {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 144px;
        height: 144px;
        object-fit: contain;
        border-radius: 999px;
        filter: drop-shadow(0 0 36px rgba(34, 211, 238, 0.5));
      }

      .baas-startup-spinner {
        box-sizing: border-box;
        width: 160px;
        height: 160px;
        border: 4px solid transparent;
        border-top-color: #06b6d4;
        border-bottom-color: #67e8f9;
        border-radius: 999px;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.75));
        animation: baas-startup-spin 0.9s linear infinite;
      }

      @keyframes baas-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #baas-startup-shell span {
        border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.64);
        padding: 8px 14px;
        font-size: 15px;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="root">
      <div id="baas-startup-shell">
        <div class="baas-startup-content">
          <div class="baas-startup-mark">
            <img src="/images/logo.png" alt="BAAS" />
            <div class="baas-startup-spinner" aria-hidden="true"></div>
          </div>
          <span>Starting BAAS...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
