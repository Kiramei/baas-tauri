<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueArchiveAutoScript</title>
    <script id="baas-theme-bootstrap">
      // This must run before stylesheets and the application bundle can paint.
      (() => {
        let theme = "system";
        try {
          const saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark" || saved === "system") theme = saved;
        } catch {
          // Restricted browser storage still permits following the system theme.
        }
        const root = document.documentElement;
        const dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.remove("light", "dark");
        root.classList.add(dark ? "dark" : "light");
        root.dataset.themePreference = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --baas-startup-background: #ffffff;
        --baas-startup-foreground: #1a1c1f;
        --baas-startup-muted: #6a6b6d;
      }

      :root.dark {
        color-scheme: dark;
        --baas-startup-background: #181818;
        --baas-startup-foreground: #dfdfdf;
        --baas-startup-muted: #999999;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: var(--background, var(--baas-startup-background));
        color: var(--foreground, var(--baas-startup-foreground));
      }

      #baas-startup-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--background, var(--baas-startup-background));
        color: var(--foreground, var(--baas-startup-foreground));
        opacity: 1;
        pointer-events: none;
        transition: opacity 160ms ease-out;
        font-family: "Blueaka", "GmarketSans", "Rubik", system-ui, sans-serif;
      }

      .baas-startup-content {
        position: relative;
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .baas-startup-mark {
        position: relative;
        display: grid;
        width: 80px;
        height: 80px;
        place-items: center;
      }

      .baas-startup-mark img {
        width: 48px;
        height: 48px;
        border-radius: 999px;
      }

      .baas-startup-spinner {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 1px solid #8883;
        border-top-color: #888;
        border-radius: 999px;
        animation: baas-startup-spin 1.05s linear infinite;
      }

      .baas-startup-spinner::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 0;
        border-radius: inherit;
      }

      @keyframes baas-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #baas-startup-shell span {
        color: var(--muted-foreground, var(--baas-startup-muted));
        font-size: 14px;
      }

      #baas-startup-shell.is-leaving {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .baas-startup-spinner {
          animation-duration: 2.4s;
        }
      }
      @media (prefers-color-scheme: dark) {
        /* A safe fallback when scripts are disabled or blocked. */
        :root:not(.light):not(.dark) {
          color-scheme: dark;
          --baas-startup-background: #181818;
          --baas-startup-foreground: #dfdfdf;
          --baas-startup-muted: #999999;
        }
      }
    </style>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body class="bg-background text-foreground">
    <div id="baas-startup-shell">
      <div class="baas-startup-content">
        <div class="baas-startup-mark">
          <img src="/images/logo.png" alt="BAAS" />
          <div class="baas-startup-spinner" aria-hidden="true"></div>
        </div>
        <span>Starting BAAS...</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
