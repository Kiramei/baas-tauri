[package]
name = "baas-tauri"
version = "0.0.6"
description = "Tauri App for pur1fying/blue_archive_auto_script"
authors = ["Kiramei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "baas_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Borrow from workspace
baas-i18n = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Main App Specified Packages
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
baas-updater = { workspace = true }
baas-term = { workspace = true }
baas-shortcut = { workspace = true }
directories = "6.0.0"
chrono = { workspace = true }
tauri-plugin-updater = "2.10.1"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "android")'.dependencies]
baas-updater = { workspace = true }
minreq = { version = "3.0.0", features = ["https-rustls"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
