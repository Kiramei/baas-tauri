[package]
name = "baas-tauri"
version = "0.0.8-rc"
description = "Tauri App for pur1fying/blue_archive_auto_script"
authors = ["Kiramei"]
edition = "2021"

[package.metadata.cargo-machete]
# `tauri-build` is invoked by build.rs. The notification plugin is registered through
# `baas-notifier`, but it must also remain a direct application dependency so Tauri's build-time
# capability generator can discover the `notification:default` permission definition.
ignored = ["tauri-build", "tauri-plugin-notification"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "baas_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Borrow from workspace
baas-i18n = { workspace = true }
baas-notifier = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# Main App Specified Packages
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
baas-updater = { workspace = true }
baas-term = { workspace = true }
baas-shortcut = { workspace = true }
directories = "6.0.0"
chrono = { workspace = true }
tauri-plugin-updater = "2.10.1"
tauri-plugin-single-instance = "2"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
baas-updater = { workspace = true }
base64 = "0.22.1"
minreq = { version = "3.0.0", features = ["https-rustls"] }
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["pem"] }
sha1 = { version = "0.10.6", features = ["oid"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
