[workspace]
members = [
	"src-tauri",
	"crates/baas-updater",
	"crates/baas-pty"
]
resolver = "2"

[workspace.dependencies]
baas-updater = { path = "crates/baas-updater" }
baas-pty = { path = "crates/baas-pty" }

tauri = { version = "2.11.2", features = ["tray-icon"] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
