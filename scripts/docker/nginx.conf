map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve an outer TLS proxy's scheme, accepting only the two valid values.
map $http_x_forwarded_proto $backend_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8191;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Backend HTTP routes
    location = /auth/remember {
        proxy_pass http://127.0.0.1:8190;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_scheme;
    }

    location = /auth/logout {
        proxy_pass http://127.0.0.1:8190;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8190;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_scheme;
    }

    # Backend WebSocket
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8190;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Local service administration is not part of the public WebUI API.
    location ^~ /system/ {
        default_type application/json;
        return 404 '{"detail":"Not found"}';
    }
    location ^~ /android/ {
        default_type application/json;
        return 404 '{"detail":"Not found"}';
    }
    location /auth/ {
        default_type application/json;
        return 404 '{"detail":"Not found"}';
    }

    # Vite hashes these filenames. Other public files may keep stable names.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /locales/ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf|br|gz)$ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    # Do not aggressively cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
