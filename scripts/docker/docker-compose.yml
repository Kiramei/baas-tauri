services:
  baas-webui:
    image: "${BAAS_WEBUI_IMAGE:-ghcr.io/kiramei/baas-webui:latest}"
    # Only the frontend is published; nginx proxies the authenticated API.
    ports:
      - "${BAAS_WEBUI_BIND:-127.0.0.1}:${BAAS_WEBUI_PORT:-8191}:8191"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
    environment:
      BRANCH: "${BRANCH:-master}"
    restart: unless-stopped
    stop_grace_period: 20s
    command:
      - https://github.com/Kiramei/baas-dev.git

# Run: docker compose -f scripts/docker/docker-compose.yml up -d
# Data is stored beside this file in scripts/docker/app; back it up before updates.
# LAN access: BAAS_WEBUI_BIND=0.0.0.0 docker compose ... up -d
# Deployment guide: https://baas.kiramei.moe/docs/en/guide/webui/
