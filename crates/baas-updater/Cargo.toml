[package]
name = "baas-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
baas-term = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
serde_json = { workspace = true }

git2 = { version = "0.21.0" }
zip = { version = "8.6.0" }
tar = { version = "0.4.44" }
toml = { version = "1.1.2" }
reqwest = { version = "0.13.4", features = ["json", "blocking", "stream"] }
flate2 = { version = "1.1.5" }
tempfile = { version = "3" }
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = { version = "0.9.0" }
