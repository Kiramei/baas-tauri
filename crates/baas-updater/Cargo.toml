[package]
name = "baas-updater"
version = "0.0.7"
edition = "2024"
readme = "README.md"
description = "Package used for baas-tauri backend update"
authors = ["Kiramei"]

[dependencies]
# Borrow from workspace
baas-term = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# Updater Specified Packages
git2 = { version = "0.21.0", features = ["https", "vendored-libgit2", "vendored-openssl"] }
toml = { version = "1.1.2" }
sha2 = { version = "0.11.0" }

[target.'cfg(not(target_os = "android"))'.dependencies]
tempfile = { workspace = true }
portable-pty = { workspace = true }
zip = { version = "8.6.0" }
tar = { version = "0.4.44" }
reqwest = { version = "0.13.4", features = ["json", "blocking", "stream"] }
flate2 = { version = "1.1.5" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[dev-dependencies]
tempfile = { workspace = true }
