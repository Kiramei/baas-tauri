[package]
name = "baas-updater"
version = "0.0.10"
edition = "2024"
readme = "README.md"
description = "Package used for baas-tauri backend update"
authors = ["Kiramei"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "baas-term/desktop"]

[dependencies]
# Borrow from workspace
baas-term = { path = "../baas-term", default-features = false }
serde = { workspace = true }
tauri = { workspace = true, optional = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# Updater Specified Packages
git2 = { version = "0.21.0", features = ["https", "vendored-libgit2", "vendored-openssl"] }
toml = { version = "1.1.2" }
tempfile = { workspace = true }
sha2 = { version = "0.11.0" }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
minreq = { version = "3.0.0", features = ["https-rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = { workspace = true }
zip = { version = "8.6.0" }
tar = { version = "0.4.44" }
reqwest = { version = "0.13.4", features = ["json", "blocking", "stream"] }
flate2 = { version = "1.1.5" }

[dev-dependencies]
tempfile = { workspace = true }
