[package]
name = "baas-ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[target.'cfg(all(unix, not(target_os = "android"), not(target_os = "ios")))'.dependencies]
libc = "0.2"
