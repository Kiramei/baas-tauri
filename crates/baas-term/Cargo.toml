[package]
name = "baas-term"
version = "0.0.9"
edition = "2024"
readme = "README.md"
description = "Package used for baas-updater terminal display"
authors = ["Kiramei"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[dependencies]
# Borrow from workspace
tauri = { workspace = true, optional = true }
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
portable-pty = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
