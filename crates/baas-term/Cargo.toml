[package]
name = "baas-term"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = { version = "0.9.0" }

[dev-dependencies]
serde_json = "1"
